[package]
name = "espada-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "C ABI job runner the Expo app uses to run CPU-bound Rust work off the JavaScript thread."

[lib]
name = "espada_engine"
# cdylib -> Android's libespada_engine.so
# staticlib -> the archives an iOS .xcframework is assembled from
# rlib -> lets this crate's own tests link it as an ordinary Rust library on the host
crate-type = ["cdylib", "rlib", "staticlib"]
