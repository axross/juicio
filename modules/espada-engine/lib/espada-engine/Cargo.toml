[package]
name = "espada-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "C ABI job runner the Expo app uses to run CPU-bound Rust work off the JavaScript thread."

[lib]
name = "espada_engine"
# cdylib -> Android's libespada_engine.so
# staticlib -> the archives an iOS .xcframework is assembled from
# rlib -> lets this crate's own tests link it as an ordinary Rust library on the host
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
# The vendored copy of `axross/espada`. Its package is `espada-internal` so it
# is never confused with the crates.io crate, but its library target is named
# `espada`, so it is imported as `espada::…` — see its `Cargo.toml` for why.
#
# Nothing in this crate calls it yet: the demo workload is prime counting, and
# wiring equity evaluation through the C ABI is the next change. The dependency
# is declared now so the copy is compiled for every target this module builds
# for, which is what proves it cross-compiles at all.
espada-internal = { path = "../espada-internal" }
