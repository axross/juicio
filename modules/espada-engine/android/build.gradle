plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// Local module, not published to Maven — see
// `expo-modules-core/expo-module-gradle-plugin`'s `ExpoModuleExtension` for
// what this flag skips (publication tasks and `publishing` DSL wiring).
expoModule {
  canBePublished false
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["arm64-v8a"]
}

android {
  namespace "expo.modules.juicionative"

  // `expo-module-gradle-plugin`'s own `applyDefaultAndroidSdkVersions()`
  // (in `expo-modules-core/expo-module-gradle-plugin`) threads
  // compileSdk/minSdk/targetSdk from `rootProject.ext` but never touches
  // `ndkVersion` — so without setting it here, AGP falls back to its own
  // bundled default NDK instead of the one the rest of the toolchain uses
  // (see `.github/workflows/build-native-library.yaml`'s "Resolve the NDK
  // version" step, which reads and comments on this exact
  // `rootProject.ext.ndkVersion` wiring). Reading it from that same
  // rootProject.ext — set by `ExpoRootProjectPlugin.defineDefaultProperties`
  // from react-native's own version catalog — keeps this module in step
  // with the root project automatically across an Expo/React Native
  // upgrade, rather than pinning a version string here too. Guarded the
  // same way `expo-modules-core`, `react-native-gesture-handler`,
  // `react-native-safe-area-context`, `react-native-screens`, and
  // `react-native-svg`'s own `android/build.gradle` all guard this same
  // line, in their own `node_modules/*/android/build.gradle`.
  if (rootProject.hasProperty("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }

  defaultConfig {
    externalNativeBuild {
      cmake {
        // Nitro's own HybridObject headers need RTTI and exceptions
        // enabled (see CMakeLists.txt); `-DANDROID_STL=c++_shared` matches
        // both `react-native-nitro-modules` and `react-native-unistyles`'s
        // own `android/build.gradle`.
        cppFlags "-frtti -fexceptions -Wall -Wextra -std=c++20"
        arguments "-DANDROID_STL=c++_shared"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    prefab true
  }

  packagingOptions {
    // These are provided by the app's own React Native / Nitro
    // dependencies already; excluding them here avoids a duplicate-.so
    // packaging conflict, matching `react-native-nitro-modules` and
    // `react-native-unistyles`'s own `packagingOptions`.
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libreactnative.so",
      "**/libreact_nativemodule_core.so",
      "**/libturbomodulejsijni.so"
    ]
  }
}

dependencies {
  // AGP only puts a *directly declared* dependency's prefab packages on this
  // module's CMake search path, not a transitive one — so `fbjni` and
  // `ReactAndroid`, which `react-native-nitro-modules` itself consumes via
  // this same coordinate (see its own `android/build.gradle`), must be
  // declared here too for `CMakeLists.txt`'s own `find_package(fbjni)` and
  // `find_package(ReactAndroid)` to resolve. `react-native-unistyles`'s own
  // `android/build.gradle` declares both dependencies the same way for the
  // same reason.
  implementation "com.facebook.react:react-native:+"
  implementation project(":react-native-nitro-modules")
}
