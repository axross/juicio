name: Setup Xcode
description: Selects this project's pinned Xcode version on a macOS runner and logs which toolchain is now active.

runs:
  using: composite
  steps:
    # Pinned rather than left at the runner image's default, which GitHub
    # rotates on its own schedule (verified against actions/runner-images'
    # macOS 26 Arm64 image on 2026-08-26: seven Xcode versions
    # side-installed, 26.6 selected as default). `xcodebuild -version`
    # confirms in the log which toolchain the rest of the job actually used.
    # If a later image drops this version, re-verify what the image ships
    # and update the pinned path — never fall back to the default.
    - name: Select Xcode Version
      shell: bash
      run: |
        sudo xcode-select -s /Applications/Xcode_26.6.app
        xcodebuild -version
