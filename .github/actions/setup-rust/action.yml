name: Setup Rust
description: Installs the stable Rust toolchain and caches its Cargo registry and modules/espada-engine build output.

inputs:
  targets:
    description: Comma-separated list of additional compilation targets to install
    required: false
    default: ""
  components:
    description: Comma-separated list of rustup components to install
    required: false
    default: ""
  cache-key-prefix:
    description: Prefix distinguishing this job's Cargo cache from other jobs'
    required: true

runs:
  using: composite
  steps:
    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
      with:
        toolchain: stable
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Cache Cargo Registry and Build Output
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          modules/espada-engine/lib/espada-engine/target
          modules/espada-engine/lib/espada-internal/target
        key: ${{ inputs.cache-key-prefix }}-${{ hashFiles('modules/espada-engine/lib/espada-engine/Cargo.lock', 'modules/espada-engine/lib/espada-internal/Cargo.lock') }}
