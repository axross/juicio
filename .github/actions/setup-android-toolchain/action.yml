name: Setup Android Toolchain
description: Installs a Temurin 17 JDK and the Android SDK.

inputs:
  java:
    description: Whether to install a Temurin 17 JDK before the Android SDK
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup JDK
      if: inputs.java == 'true'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
