name: iOS Preview

# Builds a signed ad-hoc iOS preview IPA for a pull request a maintainer
# names and distributes it through Firebase App Distribution — no EAS, no
# TestFlight, no App Store path. See docs/operations/preview-deployment.md
# for the stage-by-stage picture, the artifact hand-off, and every secret and
# variable this file reads. Mirrors android-preview.yaml's job shape; the two
# are kept as separate files rather than one matrixed workflow — see that
# document's Matrix vs. Two Files section.
#
# The dispatch is manual and always names a pull request. `preflight`
# resolves the pull request's head commit through the GitHub API rather than
# trusting the ref this run was dispatched from, and every later job checks
# out that resolved `head-sha` — never `refs/pull/<n>/head` again — so a push
# between jobs cannot change what gets built after the fork-origin guard
# approved it.
# Only `build` runs on `macos-latest`; the other three jobs run on
# `ubuntu-latest`, which is most of why this restructure is worth doing — see
# docs/operations/preview-deployment.md for the per-minute cost this bounds.

on:
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Pull request number to build and publish an iOS preview for
        required: true
        type: number

concurrency:
  group: ios-preview-${{ inputs.pull-request-number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      head-sha: ${{ steps.guard.outputs.head-sha }}
      version-name: ${{ steps.version.outputs.version-name }}
      sentry-configured: ${{ steps.check.outputs.sentry-configured }}
    steps:
      - name: Resolve required configuration
        id: check
        env:
          HAS_APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 != '' }}
          HAS_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID != '' }}
          HAS_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
          HAS_FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID != '' }}
          HAS_SENTRY_ORG: ${{ vars.SENTRY_ORG != '' }}
          HAS_SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT != '' }}
          HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        run: |
          # Every HAS_* value above is a plain "true"/"false" string resolved
          # in env, never in an `if:` expression, so nothing below can echo a
          # secret's actual value. This is the iOS secret set only: an
          # unconfigured Android setup can never fail this dispatch, and the
          # reverse is equally true of android-preview.yaml's own preflight.
          missing=()
          [ "$HAS_APPLE_DISTRIBUTION_CERTIFICATE_BASE64" = "true" ] || missing+=("APPLE_DISTRIBUTION_CERTIFICATE_BASE64 (secret)")
          [ "$HAS_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" = "true" ] || missing+=("APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD (secret)")
          [ "$HAS_APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64" = "true" ] || missing+=("APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64 (secret)")
          [ "$HAS_APPLE_DEVELOPER_TEAM_ID" = "true" ] || missing+=("APPLE_DEVELOPER_TEAM_ID (variable)")
          [ "$HAS_FIREBASE_SERVICE_ACCOUNT_JSON" = "true" ] || missing+=("FIREBASE_SERVICE_ACCOUNT_JSON (secret)")
          [ "$HAS_FIREBASE_IOS_APP_ID" = "true" ] || missing+=("FIREBASE_IOS_APP_ID (variable)")

          sentry_missing=()
          [ "$HAS_SENTRY_ORG" = "true" ] || sentry_missing+=("SENTRY_ORG (variable)")
          [ "$HAS_SENTRY_PROJECT" = "true" ] || sentry_missing+=("SENTRY_PROJECT (variable)")
          [ "$HAS_SENTRY_AUTH_TOKEN" = "true" ] || sentry_missing+=("SENTRY_AUTH_TOKEN (secret)")

          {
            echo "### iOS Preview Configuration"
            echo "| Entry | Kind | Present |"
            echo "| --- | --- | --- |"
            echo "| APPLE_DISTRIBUTION_CERTIFICATE_BASE64 | Secret | $HAS_APPLE_DISTRIBUTION_CERTIFICATE_BASE64 |"
            echo "| APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD | Secret | $HAS_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD |"
            echo "| APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64 | Secret | $HAS_APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64 |"
            echo "| APPLE_DEVELOPER_TEAM_ID | Variable | $HAS_APPLE_DEVELOPER_TEAM_ID |"
            echo "| FIREBASE_SERVICE_ACCOUNT_JSON | Secret | $HAS_FIREBASE_SERVICE_ACCOUNT_JSON |"
            echo "| FIREBASE_IOS_APP_ID | Variable | $HAS_FIREBASE_IOS_APP_ID |"
            echo "| SENTRY_ORG | Variable | $HAS_SENTRY_ORG |"
            echo "| SENTRY_PROJECT | Variable | $HAS_SENTRY_PROJECT |"
            echo "| SENTRY_AUTH_TOKEN | Secret | $HAS_SENTRY_AUTH_TOKEN |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Sentry is resolved, and its own warning emitted, before the
          # required-configuration exit below — so an incomplete Sentry set
          # is never lost to a `preflight` failure it must not cause.
          if [ "${#sentry_missing[@]}" -eq 0 ]; then
            echo "sentry-configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "sentry-configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sentry source-map upload is not configured — skipping it. Missing: ${sentry_missing[*]}. The build and the Firebase publish still proceed; see docs/operations/preview-deployment.md."
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::iOS preview deployment is not configured — the following required configuration is missing (see docs/operations/preview-deployment.md and docs/operations/secrets.md):"
            for entry in "${missing[@]}"; do
              echo "::error::Missing required configuration: ${entry}"
            done
            exit 1
          fi

      # A `workflow_dispatch` run always receives every secret, whatever ref
      # it later checks out — unlike a `pull_request` run, which withholds
      # them from a fork head. This step restores that guarantee: it resolves
      # the pull request through the API and fails before any later job
      # checks out or executes its code. See docs/operations/preview-deployment.md.
      - name: Refuse a head outside this repository
        id: guard
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            // `head.repo` is null when the head repository has been deleted;
            // that is "origin cannot be confirmed", which fails closed here
            // rather than reading as trusted.
            const headRepo = pr.head.repo ? pr.head.repo.full_name : null;
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (headRepo !== thisRepo) {
              core.setFailed(
                `Pull request #${pr.number}'s head is ${headRepo ?? 'an unresolvable repository'}, not ${thisRepo}. ` +
                  `This workflow builds and signs the checked-out code with this repository's Apple and Firebase credentials, ` +
                  `so it refuses a head it cannot attribute to this repository. See docs/operations/preview-deployment.md.`,
              );
              return;
            }
            core.setOutput('head-sha', pr.head.sha);
            core.notice(`Building pull request #${pr.number} at head commit ${pr.head.sha}.`);
        env:
          PR_NUMBER: ${{ inputs.pull-request-number }}

      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.guard.outputs.head-sha }}

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Compute preview version name
        id: version
        run: |
          version=$(node -p "require('./app.json').expo.version")
          echo "version-name=${version}-pr-${{ inputs.pull-request-number }}" >> "$GITHUB_OUTPUT"

      - name: Write preflight summary
        run: |
          {
            echo "### Preflight"
            echo "- Commit: \`${{ steps.guard.outputs.head-sha }}\`"
            echo "- Preview version: \`${{ steps.version.outputs.version-name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  prebuild:
    name: Prebuild
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      sentry-release: ${{ steps.sentry-release.outputs.sentry-release }}
    env:
      PREVIEW_VERSION_NAME: ${{ needs.preflight.outputs.version-name }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head-sha }}

      # The ambient GITHUB_SHA a `workflow_dispatch` run gets from Actions
      # names the dispatched-from ref, not this checkout. `app.config.ts`
      # reads GITHUB_SHA to compose the Sentry release string below, so the
      # real head commit is exported explicitly ahead of that read.
      - name: Export checked-out commit SHA
        run: echo "GITHUB_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true

      # `resolveSentryRelease` in src/core/instrumentation/sentry-identity.ts
      # computes this once and `app.config.ts` exposes it at
      # `extra.sentryRelease`; reading it here (rather than recomposing
      # `${version}+${sha}`) keeps the release the app reports at runtime and
      # the release the `build` job's Sentry upload is filed under the same
      # value from the same source.
      - name: Resolve Sentry release
        id: sentry-release
        run: |
          release=$(npx expo config --type public --json | jq -r '.extra.sentryRelease')

          # This step sets no `shell:`, so it runs under the implicit `bash -e
          # {0}` — no `pipefail`. The assignment takes jq's exit status, not
          # npx's: a failing `npx expo config` with no stdout leaves jq
          # reading empty input, silently exiting 0, so `release` could end up
          # empty or `null` instead of failing loud.
          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo "::error::Failed to resolve the Sentry release — \`npx expo config --type public --json | jq -r '.extra.sentryRelease'\` produced '${release:-<empty>}'. Check this step's log above for npx's own error; if it succeeded, confirm app.config.ts still exposes extra.sentryRelease (src/core/instrumentation/sentry-identity.ts)."
            exit 1
          fi

          echo "sentry-release=${release}" >> "$GITHUB_OUTPUT"

      # Caches the bare `expo prebuild` output only — `pod install` needs
      # macOS and runs in the `build` job below, against its own cache.
      - name: Restore prebuild cache
        id: prebuild-cache
        uses: actions/cache@v6
        with:
          path: ios
          key: prebuild-ios-${{ hashFiles('app.json', 'app.config.ts', 'package-lock.json') }}-${{ env.PREVIEW_VERSION_NAME }}

      - name: Generate native iOS project
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --no-install

      # actions/upload-artifact normalises permissions on upload (dirs 755,
      # files 644); the generated ios/ tree carries no symlink or executable
      # bit that loses, but a tar archive keeps this step identical in shape
      # to android-preview.yaml's own hand-off.
      - name: Archive native iOS project
        run: tar -czf native-ios.tar.gz ios

      - name: Upload native iOS project
        uses: actions/upload-artifact@v7
        with:
          name: native-project-ios
          path: native-ios.tar.gz
          retention-days: 1

  build:
    name: Build
    needs: [preflight, prebuild]
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      PREVIEW_VERSION_NAME: ${{ needs.preflight.outputs.version-name }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head-sha }}

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode

      # Same reasoning as the prebuild job's own export: `pod install` and
      # `bundle exec fastlane ios build` below re-evaluate app.config.ts to
      # bundle the JS `Constants`, and the ambient GITHUB_SHA is wrong for
      # that read too.
      - name: Export checked-out commit SHA
        run: echo "GITHUB_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby

      # A throwaway keychain, created and unlocked for this run only, holds
      # the imported distribution certificate. The keychain password never
      # needs to be remembered past this job, so it is generated fresh here
      # rather than stored anywhere.
      - name: Import signing certificate
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/ios-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          cert_path="$RUNNER_TEMP/ios_distribution.p12"

          # A copy-pasted secret commonly picks up wrapped line breaks or a
          # trailing carriage return; base64 carries no information in
          # whitespace, so strip all of it before decoding rather than
          # rejecting an otherwise-correct value outright — same rule
          # android-preview.yaml's keystore step applies to
          # ANDROID_KEYSTORE_BASE64.
          if ! printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 --decode > "$cert_path" 2>/dev/null || [ ! -s "$cert_path" ]; then
            echo "::error::APPLE_DISTRIBUTION_CERTIFICATE_BASE64 is not valid base64 (all whitespace was already stripped before decoding, so this is not a line-wrapping or CRLF artifact). Recreate it locally: base64 your-distribution-certificate.p12 | tr -d '\n' > certificate.b64, then paste certificate.b64's contents into the APPLE_DISTRIBUTION_CERTIFICATE_BASE64 secret. See docs/operations/secrets.md."
            exit 1
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"

          # Import failure here almost always means one of the two secrets
          # is wrong; `security`'s own PKCS12 error text names a wrong
          # password distinctly enough to tell the two apart, the same way
          # android-preview.yaml's keytool check does for the Android
          # keystore and its password.
          import_log="$RUNNER_TEMP/security-import.log"
          if ! security import "$cert_path" -k "$keychain_path" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > "$import_log" 2>&1; then
            if grep -qi "wrong password\|MAC verification failed" "$import_log"; then
              echo "::error::APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD does not unlock the certificate decoded from APPLE_DISTRIBUTION_CERTIFICATE_BASE64. Confirm the password matches the .p12 export and has no leading or trailing whitespace. See docs/operations/secrets.md."
            else
              echo "::error::APPLE_DISTRIBUTION_CERTIFICATE_BASE64 decoded successfully but is not a valid .p12 certificate. Re-export it from Keychain Access (or your certificate source) and base64-encode the result, then paste it into the APPLE_DISTRIBUTION_CERTIFICATE_BASE64 secret. See docs/operations/secrets.md."
            fi
            exit 1
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" > /dev/null

          existing_keychains=$(security list-keychains -d user | sed 's/[",]//g')
          security list-keychains -d user -s "$keychain_path" $existing_keychains
          security default-keychain -d user -s "$keychain_path"

          # Prove a usable signing identity actually landed in the keychain
          # before the build ever trusts it. Only `security`'s own summary
          # line ("N valid identities found") decides the count — grepping
          # for any line that merely starts with a digit would also match
          # that same summary line when N is 0.
          #
          # Both substitutions end in `|| true` because this step sets no
          # `shell:`, so Actions runs it as `bash -e {0}`: a failing command
          # substitution in an assignment aborts the step immediately, so a
          # `grep` matching nothing would kill the job with a raw, unnamed
          # error instead of the named `::error::` below.
          identity_summary=$(security find-identity -v -p codesigning "$keychain_path" | grep -o '[0-9]\+ valid identities found' || true)
          identity_count=$(printf '%s' "$identity_summary" | grep -o '^[0-9]\+' || true)
          if [ -z "$identity_count" ] || [ "$identity_count" -lt 1 ]; then
            echo "::error::APPLE_DISTRIBUTION_CERTIFICATE_BASE64 imported into the signing keychain but no code-signing identity was found in it. Confirm the secret holds a distribution (not development) certificate exported as .p12 with its private key included. See docs/operations/secrets.md."
            exit 1
          fi

      # Xcode looks up profiles by UUID filename under this directory. The
      # profile's name, UUID, and bundle identifier are all derived from the
      # profile's own signed payload (`security cms -D` decodes the
      # CMS/PKCS#7 envelope every .mobileprovision file is) rather than
      # hardcoded, so a profile regenerated in the Apple Developer portal (a
      # new UUID every time) needs no workflow edit.
      - name: Install provisioning profile
        env:
          APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          profile_path="$RUNNER_TEMP/ios_adhoc.mobileprovision"
          plist_path="$RUNNER_TEMP/ios_adhoc.plist"

          if ! printf '%s' "$APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$profile_path" 2>/dev/null || [ ! -s "$profile_path" ]; then
            echo "::error::APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64 is not valid base64 (all whitespace was already stripped before decoding, so this is not a line-wrapping or CRLF artifact). Recreate it locally: base64 your-profile.mobileprovision | tr -d '\n' > profile.b64, then paste profile.b64's contents into the APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64 secret. See docs/operations/secrets.md."
            exit 1
          fi

          if ! security cms -D -i "$profile_path" > "$plist_path" 2>/dev/null; then
            echo "::error::APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64 decoded successfully but is not a valid .mobileprovision file (security cms could not read its signed payload). Re-download the ad-hoc provisioning profile from the Apple Developer portal, base64-encode it, and paste the result into the APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64 secret. See docs/operations/secrets.md."
            exit 1
          fi

          # `|| true` on each, for the same reason as the identity check in
          # the previous step: PlistBuddy exits non-zero when the key it was
          # asked for is absent, and under this step's implicit `bash -e`
          # that would abort before the `if` below ever runs.
          profile_uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$plist_path" 2>/dev/null || true)
          profile_name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$plist_path" 2>/dev/null || true)
          app_id_entitlement=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$plist_path" 2>/dev/null || true)

          if [ -z "$profile_uuid" ] || [ -z "$profile_name" ] || [ -z "$app_id_entitlement" ]; then
            echo "::error::APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64 decoded to a .mobileprovision file missing a UUID, a Name, or an application-identifier entitlement. Re-download the ad-hoc provisioning profile from the Apple Developer portal and re-encode it. See docs/operations/secrets.md."
            exit 1
          fi

          # application-identifier is "<team id>.<bundle identifier>" (or
          # "<team id>.*" for a wildcard profile, which an ad-hoc
          # distribution profile never is) — strip the team-id prefix to get
          # the bundle identifier this profile was actually issued for.
          profile_bundle_identifier="${app_id_entitlement#*.}"
          app_bundle_identifier=$(node -p "require('./app.json').expo.ios.bundleIdentifier")

          if [ "$profile_bundle_identifier" != "$app_bundle_identifier" ]; then
            echo "::error::APPLE_AD_HOC_PROVISIONING_PROFILE_BASE64 was issued for bundle identifier '${profile_bundle_identifier}', which does not match this app's '${app_bundle_identifier}' (app.json's expo.ios.bundleIdentifier). Generate an ad-hoc provisioning profile for the correct app identifier and re-encode it. See docs/operations/secrets.md."
            exit 1
          fi

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          cp "$profile_path" "$profiles_dir/${profile_uuid}.mobileprovision"

          echo "PROVISIONING_PROFILE_NAME=${profile_name}" >> "$GITHUB_ENV"
          echo "APP_BUNDLE_IDENTIFIER=${app_bundle_identifier}" >> "$GITHUB_ENV"
          echo "Installed provisioning profile '${profile_name}' (${profile_uuid}) for ${app_bundle_identifier}."

      - name: Download native iOS project
        uses: actions/download-artifact@v8
        with:
          name: native-project-ios

      - name: Extract native iOS project
        run: tar -xzf native-ios.tar.gz

      # `pod install`'s cost is billed at the macOS rate, so the whole
      # generated ios/ directory (where ios/Pods, the .xcworkspace, and
      # Podfile.lock all live) plus CocoaPods' own download/spec cache are
      # cached together — a hit restores over the freshly extracted prebuild
      # tree and skips "Install CocoaPods dependencies" entirely. Caching
      # only ios/Pods and passing expo prebuild's --no-clean flag to reuse it
      # was tried first and rejected: verified against Expo SDK 57's actual
      # prebuild output, a restored ios/Pods with no matching
      # .xcodeproj/Podfile next to it is detected as a malformed native
      # project and cleared anyway, before pod install ever ran.
      - name: Restore CocoaPods cache
        id: pods-cache
        uses: actions/cache@v6
        with:
          path: |
            ios
            ~/Library/Caches/CocoaPods
          key: pods-ios-${{ hashFiles('app.json', 'app.config.ts', 'package-lock.json') }}-${{ env.PREVIEW_VERSION_NAME }}

      - name: Install CocoaPods dependencies
        if: steps.pods-cache.outputs.cache-hit != 'true'
        working-directory: ios
        run: pod install

      # The prebuild cache above, and the CocoaPods cache just restored, are
      # both keyed on inputs that do not change between two dispatches of the
      # same pull request, so either can restore a CFBundleVersion an earlier
      # run already baked in. Stamping it here, after both caches have had
      # their say and unconditionally either way, makes this run's own
      # GITHUB_RUN_NUMBER win regardless of which one hit.
      - name: Stamp build number
        run: |
          # Both the Set and Print read-backs end in `|| true`, same reason as
          # above: this step sets no `shell:`, so Actions runs it as `bash -e
          # {0}`, and a failing command substitution aborts the step
          # immediately — a missing CFBundleVersion key would otherwise kill
          # the job with a raw error instead of the named `::error::` below.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" ios/juicio/Info.plist 2>/dev/null || true
          actual=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios/juicio/Info.plist 2>/dev/null || true)
          if [ "$actual" != "$GITHUB_RUN_NUMBER" ]; then
            echo "::error::Failed to stamp GITHUB_RUN_NUMBER (${GITHUB_RUN_NUMBER}) into ios/juicio/Info.plist's CFBundleVersion — read back '${actual:-<none>}'."
            exit 1
          fi

      # `fastlane ios build` (fastlane/Fastfile) reads APPLE_DEVELOPER_TEAM_ID
      # plus the provisioning-profile name and bundle identifier the earlier
      # step derived from the profile itself. Sentry's iOS source-map upload
      # rides inside this same `xcodebuild archive`, via the Xcode
      # build-phase script `@sentry/react-native/expo` wires in at prebuild
      # time — gated the same way android-preview.yaml's Gradle-plugin
      # upload is.
      #
      # EXPO_PUBLIC_SENTRY_DSN sits here too because this is the step where
      # the bundler inlines EXPO_PUBLIC_ variables into the JS bundle, not
      # at prebuild or publish — see docs/operations/secrets.md for the rest.
      - name: Build signed ad-hoc IPA
        id: build
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ needs.prebuild.outputs.sentry-release }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ needs.preflight.outputs.sentry-configured == 'false' && 'true' || 'false' }}
        run: bundle exec fastlane ios build

      - name: Stage signed IPA for hand-off
        run: |
          mkdir -p dist
          cp "${{ steps.build.outputs.ipa-path }}" dist/juicio-preview.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v7
        with:
          name: preview-binary-ios
          path: dist/juicio-preview.ipa
          retention-days: 1

  publish:
    name: Publish
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment the install link on this pull request
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.head-sha }}

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby

      - name: Download signed IPA
        uses: actions/download-artifact@v8
        with:
          name: preview-binary-ios
          path: dist

      # Same rule as the certificate above: the credentials file lives under
      # $RUNNER_TEMP, outside the working tree, and only its path reaches
      # fastlane. The secret holds the service-account JSON verbatim, so no
      # whitespace is stripped — that would corrupt the JSON.
      - name: Write Firebase service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          credentials_path="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_path"

          if ! jq_error=$(jq empty "$credentials_path" 2>&1); then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON (${jq_error}). Re-download the service-account key from the Firebase console (Project settings -> Service accounts) or Google Cloud console (IAM & Admin -> Service Accounts -> Keys) and paste its contents verbatim -- do not base64-encode it -- into the FIREBASE_SERVICE_ACCOUNT_JSON secret. See docs/operations/secrets.md."
            exit 1
          fi

          # Both substitutions end in `|| true`: `jq empty` above only proves
          # the file is valid JSON, not that its top level is an object — a
          # valid JSON array or scalar (e.g. `[1,2,3]` or `"x"`) passes that
          # check but makes `.[$f]` a jq type error, which exits non-zero.
          # Under this step's implicit `bash -e {0}` that aborts before the
          # field-shape `::error::` below runs.
          missing_fields=()
          for field in type project_id private_key client_email; do
            value=$(jq -r --arg f "$field" '.[$f] // empty' "$credentials_path" 2>/dev/null || true)
            [ -n "$value" ] || missing_fields+=("$field")
          done
          account_type=$(jq -r '.type // empty' "$credentials_path" 2>/dev/null || true)

          if [ "${#missing_fields[@]}" -gt 0 ] || [ "$account_type" != "service_account" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON does not look like a service-account key (expected \"type\": \"service_account\" plus project_id, private_key, and client_email). Re-download it from the Firebase console (Project settings -> Service accounts) or Google Cloud console (IAM & Admin -> Service Accounts -> Keys) and paste its contents verbatim into the FIREBASE_SERVICE_ACCOUNT_JSON secret. See docs/operations/secrets.md."
            exit 1
          fi

          echo "FIREBASE_SERVICE_ACCOUNT_CREDENTIALS_PATH=$credentials_path" >> "$GITHUB_ENV"

      - name: Publish to Firebase App Distribution
        id: publish
        env:
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          PREVIEW_IPA_PATH: dist/juicio-preview.ipa
        run: bundle exec fastlane ios publish

      # A fresh comment per deploy, never an edit to a previous one, gated on
      # the publish step's own output — so a run that did not actually
      # publish never comments a link at all.
      - name: Comment install link on pull request
        if: steps.publish.outputs.testing-uri != ''
        uses: actions/github-script@v9
        env:
          TESTING_URI: ${{ steps.publish.outputs.testing-uri }}
          VERSION_NAME: ${{ needs.preflight.outputs.version-name }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
        with:
          script: |
            const testingUri = process.env.TESTING_URI;
            const versionName = process.env.VERSION_NAME;
            const prNumber = Number(process.env.PR_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `<!-- agent -->\niOS preview build \`${versionName}\` is ready: ${testingUri}`,
            });
            core.notice(`iOS preview build ${versionName} is ready: ${testingUri}`);
            await core.summary
              .addHeading('iOS Preview Published')
              .addRaw(`Build \`${versionName}\` is ready: ${testingUri}`)
              .write();
