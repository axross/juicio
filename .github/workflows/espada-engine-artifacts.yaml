name: Espada Engine Artifacts

# cross-compiles modules/espada-engine/lib/ for both platforms, generates its
# Nitro bindings, and commits all three resulting artifacts directly onto
# whatever branch this workflow is dispatched against, once every build and
# verification step passes. the binaries are committed rather than rebuilt on
# every ordinary build: producing the iOS one needs a macOS runner, which
# bills at roughly 10x a ubuntu-latest one ($0.062/min against $0.006/min —
# see docs/operations/preview-deployment.md), so this workflow, like the two
# preview pipelines, spends that cost only when a human explicitly asks for
# it.
#
# producing this module's committed artifacts happens entirely here. there is
# no local script that reproduces this on a maintainer's own machine — a
# developer who never touches modules/espada-engine/ keeps exactly today's
# workflow: no Rust toolchain, no NDK, no local build step. a maintainer who
# does need to iterate on the Rust or the Nitro spec still has
# `npm run nitrogen:espada-engine` locally (see package.json); only the
# cross-compiles and the artifact-verification steps below live in this
# workflow alone. nothing in this project's merge-check workflows runs the
# generator any more, so running it locally is the only thing that keeps the
# committed bindings in step with the spec, and nothing checks that anyone
# did.
#
# dispatched by hand only, against a branch chosen through GitHub's own
# `workflow_dispatch` ref selector: no `pull_request`, `push`, or `schedule`
# trigger, matching this project's standing policy that anything spending
# macOS minutes runs only when a human dispatches it. a maintainer changing
# modules/espada-engine's Rust on a feature branch dispatches this workflow
# against that same branch — no pull request needs to already be open for
# it — and, once every build and verification step below passes, the fresh
# artifacts land directly on that branch, ready for
# android-preview.yaml/ios-preview.yaml (both unchanged, both still taking a
# pull request number of their own) to build a device-installable preview
# from, once a pull request exists to name. no workflow chains automatically:
# each stage — commit the artifacts, then build an Android preview, then
# build an iOS preview — stays its own separate, manually dispatched run.
#
# `preflight` resolves the dispatch target from ambient context rather than
# an API call — the same idiom android-release.yaml's own preflight already
# relies on to resolve its commit without one: `github.ref_type`/
# `github.ref_name` name what this run was dispatched against and whether it
# is a branch at all, and `github.sha` already names the exact commit GitHub
# fixed for the whole run, so, unlike the pull request this workflow used to
# require, there is no fork-origin ambiguity to guard against either — a
# plain branch is named directly by whoever dispatches, who by definition
# already has the write access that requires. what this job refuses is new
# to this workflow, though, not shared with android-release.yaml (which
# carries no such guard, since releasing from `main` is its whole point): a
# target a pull request's own branch could never have been — `main` itself,
# or a tag rather than a branch.
#
# it runs seven jobs. `preflight` (ubuntu-slim) refuses the run before it
# reaches any other job when the dispatched ref is not eligible, as above.
# `build-android` (ubuntu-latest, `needs: preflight`) cross-compiles for
# aarch64-linux-android, verifies the produced .so is 16 KB page aligned, and
# verifies its exported C ABI matches every .rs file directly under
# modules/espada-engine/lib/espada-engine/src/ — failing the job, and never
# uploading an artifact, if either check does not pass; `build-ios`
# (macos-latest, `needs: preflight`) builds the two Apple arm64 slices,
# verifies each slice's own exported C ABI against that same set of FFI
# source files (a subset check, not an exact-set one — see that job's own
# comment), and assembles them into an .xcframework with `xcodebuild
# -create-xcframework` (`lipo` cannot merge them — both slices are arm64,
# which is exactly why this is an .xcframework and not a fat static
# library); `generate-bindings` (ubuntu-latest, `needs: preflight`) runs
# Nitrogen against modules/espada-engine's `.nitro.ts` spec to produce its
# C++ bindings, registration, and per-platform autolinking files — it carries
# no further `needs:` and runs concurrently with the two build jobs, not
# after them, because Nitrogen reads only the TypeScript spec and nitro.json
# and the Rust cross-compiles do not depend on its output in either direction
# (see that job's own comment before "fixing" this by adding a dependency).
# `build-android`, `build-ios`, and `generate-bindings` run in parallel once
# `preflight` clears the dispatch target, and share nothing but the commit
# GitHub fixed at dispatch time.
#
# two verification jobs then gate the commit, before any binary reaches the
# dispatched branch. `verify-android` (ubuntu-latest, `needs: [preflight,
# build-android, generate-bindings]`) downloads both, places them at their
# committed paths, and runs an actual `expo prebuild` plus `gradlew
# assembleDebug` against them — this is merge-checks.yaml's former
# `native_android_compile` job, moved here so the exact binary this run is
# about to commit is what gets compiled, not whatever happened to already be
# committed; `verify-ios` (macos-latest, `needs: [preflight, build-ios,
# generate-bindings]`) does the iOS equivalent — `pod install` plus an
# unsigned `xcodebuild build` — and is this project's former
# `ios-native-compile.yaml`, moved here for the same reason. `commit-to-branch`
# needs `preflight` plus all five build and verification jobs above: no
# binary reaches a commit until it has been shown to build and to link on
# both platforms.
#
# it is no longer shown to pass `cargo fmt`, `cargo clippy`, or `cargo test`
# first. those three moved to Rust Merge Checks (rust-merge-checks.yaml)'s
# own `lint` and `test` jobs, which run on a pull request touching
# modules/espada-engine/lib/espada-engine/**. every build and verification
# job here now builds from the exact commit GitHub fixed for the dispatched
# branch at dispatch time, so a dispatch against a branch whose Rust never
# reached such a pull-request check commits binaries no Cargo command has
# vetted. that guarantee is weaker than the one this workflow used to make,
# and it is accepted rather than mitigated here. `verify-ios` is a hard gate
# from the start, decided at the plan behind this workflow, not an
# afterthought to relax later: nothing in this repository has ever linked the
# iOS half into an app (see docs/operations/native-module-artifacts.md's
# "What Compiling the iOS Half Proves"), so the first dispatch that reaches
# it may well fail on a pre-existing problem — finding that out before a
# binary is committed is the point of gating on it, not an inconvenience to
# route around.
#
# a pull request that happens to already be open against the dispatched
# branch does not start its own checks on its own once this workflow pushes
# to it, but they do exist. the push is made with the default
# `GITHUB_TOKEN`, and GitHub's events reference states that a `pull_request`
# event created that way — `opened`, `synchronize`, or `reopened` — still
# creates a workflow run, one that requires approval; it is the other
# `GITHUB_TOKEN`-triggered events that create no run at all. pushing a
# commit onto a branch a pull request happens to point at is exactly the
# `synchronize` activity type that rule already covers, so if a pull request
# happens to be open for the dispatched branch, each of this repository's
# three merge-check workflows creates its own run against it, held the same
# way `opened`/`reopened` held it before this change. approving them from
# the pull request page — write access is enough — is the whole remedy:
# nothing has to be pushed again and the pull request does not have to be
# reopened. closing and reopening that same pull request is the fallback for
# a pending run that no longer exists, since GitHub deletes runs awaiting
# approval after 30 days. none of this depends on a pull request existing at
# all: a branch with no pull request open against it gets the artifacts
# committed the same way, with no approval to give because nothing was ever
# created to hold.
#
# nothing here comments on a pull request, whether or not one happens to be
# open against the dispatched branch — this workflow no longer resolves one
# to comment on, and a branch can have more than one pull request pointed at
# it besides. `commit-to-branch`'s own job summary is this workflow's one and
# only reporting surface, following android-release.yaml's own
# `$GITHUB_STEP_SUMMARY` convention.

on:
  workflow_dispatch: {}

# cancelling a run mid-commit-to-branch is safer than it used to be: that job
# pushes directly onto the dispatched branch by name rather than a freshly
# created one, so a cancellation landing after the push succeeds but before
# the summary step runs leaves the artifacts committed with no summary
# written — a missed notification, not an orphaned branch or a failed
# pull-request creation. concurrency is kept anyway: two overlapping
# dispatches against the same branch would each resolve their own commit and
# could race pushing onto that same branch, the second failing on a
# non-fast-forward push against the first run's own commit rather than
# against anything a human pushed.
concurrency:
  group: espada-engine-artifacts-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-slim
    # a couple of string comparisons against the run's own ambient context —
    # no dependency install, no build, no API call. generous for what this
    # job does, not a measured ceiling; raised to the nearest rung on this
    # project's timeout-minutes ladder
    # (docs/conventions/continuous-integration.md) rather than left at an
    # off-ladder value.
    timeout-minutes: 5
    steps:
      # a `workflow_dispatch` run always receives every secret, whatever ref
      # it later checks out. this step fails before any later job checks out
      # or executes its code, or before the final job's `GITHUB_TOKEN`
      # (`contents: write` on this repository) ever pushes anywhere, when the
      # dispatched ref is not something this workflow is willing to commit
      # onto: `github.ref_type != 'branch'` catches a tag (a pull request's
      # own branch could never have been one, so the pull-request-based
      # version of this workflow never needed this check), and
      # `github.ref_name == github.event.repository.default_branch` refuses
      # this repository's default branch, `main` — the same fail-closed style
      # this workflow's own "Verify 16 KB Page Alignment" steps below use.
      - name: Verify Dispatch Target
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "branch" ]; then
            echo "::error::Dispatched against ${{ github.ref_name }}, a ${{ github.ref_type }}, not a branch. This workflow builds artifacts from a branch and pushes a commit onto it with this repository's own GITHUB_TOKEN, so it refuses anything that is not a branch. Re-dispatch it against a branch instead. See docs/operations/native-module-artifacts.md."
            exit 1
          fi
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::Dispatched against ${{ github.ref_name }}, this repository's default branch. This workflow commits generated binaries and bindings directly onto whatever branch it is dispatched against, and refuses to do that to the default branch. Re-dispatch it against a feature branch instead. See docs/operations/native-module-artifacts.md."
            exit 1
          fi
          echo "Dispatched against branch ${{ github.ref_name }} at commit ${{ github.sha }}."

  build-android:
    name: Build Android (.so)
    needs: preflight
    runs-on: ubuntu-latest
    # roughly double this job's own estimated warm-path duration: a release
    # cross-compile of two crates (espada-engine plus the forked
    # espada-internal, both under `lto = "fat"`, `codegen-units = 1`) via
    # cargo-ndk, plus provisioning the Android SDK/NDK and Rust toolchain
    # from a cold cache. this job has completed successfully before (see
    # docs/operations/native-module-artifacts.md), but its wall-clock time
    # is not recorded there, so this ceiling is estimated, not measured.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true

      # Expo's own root-project Gradle plugin (ExpoRootProjectPlugin, in
      # expo-modules-autolinking/android/expo-gradle-plugin) sets
      # `rootProject.ext.ndkVersion` — which every generated
      # `android/*/build.gradle` reads — from an "expoLibs" Gradle version
      # catalog it builds from exactly this file
      # (ExpoAutolinkingSettingsExtension.useExpoVersionCatalog), and nothing
      # in this app overrides that value: verified by reading both plugins'
      # source under node_modules/expo-modules-autolinking/ rather than
      # assumed, after `npx expo prebuild --platform android --no-install`
      # confirmed no plain-text "ndkVersion" ever appears in the generated
      # project itself — the value is resolved by the Gradle plugin at
      # configure time, not written into the generated files as text. reading
      # it from its actual source is what keeps this job correct across an
      # Expo SDK bump that changes it, rather than hard-coding the version
      # this SDK release happens to pin today (unconfirmable from a primary
      # source during planning). resolved by this action's own "Resolve NDK
      # Version" step, which exposes it as this step's `ndk-version` output,
      # so this job parses libs.versions.toml only once rather than
      # duplicating that same grep/sed pipeline here.
      - name: Setup Android Toolchain
        id: setup-toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          java: false

      # installs the exact numeric NDK package Android's own SDK manager
      # uses (e.g. "27.1.12297006") — the same identifier the Setup Android
      # Toolchain step above just resolved, so there is no letter-release
      # (e.g. "r27d") mapping to get wrong. lands at
      # $ANDROID_SDK_ROOT/ndk/<version>.
      - name: Install NDK
        run: sdkmanager --install "ndk;${{ steps.setup-toolchain.outputs.ndk-version }}"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android
          cache-key-prefix: cargo-android

      # cargo-ndk cross-compiles a Rust crate for an Android NDK target,
      # resolving the right clang triple and API level and laying its output
      # out per-ABI (`-o <dir>` producing `<dir>/<abi>/lib<name>.so`) — exactly
      # the jniLibs/<abi>/ shape this crate's binary is committed under.
      # installed from source (`cargo install`) rather than through
      # taiki-e/install-action: verified against that action's own TOOLS.md
      # that cargo-ndk is not one of its curated tools, so installing it
      # directly is the more certain path rather than relying on its
      # cargo-binstall fallback for a tool it does not list.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # -Wl,-z,max-page-size=16384 is passed unconditionally, per the plan:
      # harmless on NDK r28+ (which defaults to 16 KB alignment already) and
      # required on r27 and earlier — which the Setup Android Toolchain step
      # above confirms this Expo SDK release still pins. CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS
      # (rather than a committed .cargo/config.toml) is exactly the
      # environment-only mechanism the plan asks for, so nothing here
      # hard-codes an NDK path the way the reference proof of concept did.
      #
      # sets a SONAME on binaries this workflow produces, per
      # docs/operations/native-module-artifacts.md's SONAME section. it does
      # nothing for the .so already committed;
      # modules/espada-engine/android/CMakeLists.txt's IMPORTED_NO_SONAME TRUE
      # covers that one.
      #
      # working-directory is set to the crate itself rather than passing
      # cargo-ndk's own --manifest-path: cargo-ndk 4.1.2 runs `cargo
      # metadata` against the current directory before it ever looks at that
      # flag, so from the repo root it fails with "could not find
      # `Cargo.toml`" regardless of whether --manifest-path is placed before
      # or after `build` — confirmed by trying both. because the working
      # directory moves, -o is given an absolute path
      # ($GITHUB_WORKSPACE/android-output) so the output still lands at the
      # repo-root android-output/ every later step in this job reads from.
      - name: Cross-Compile for arm64-v8a
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-soname,libespada_engine.so"
          RESOLVED_NDK_VERSION: ${{ steps.setup-toolchain.outputs.ndk-version }}
        working-directory: modules/espada-engine/lib/espada-engine
        run: |
          set -euo pipefail
          # android-actions/setup-android exports the SDK root itself; which
          # of the two conventional names it uses is not asserted here from
          # memory, so both are checked and the resolution failing loudly
          # (rather than cargo-ndk failing later with a confusing "NDK not
          # found") is what a wrong assumption here would look like.
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo "::error::Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set after Setup Android SDK."
            exit 1
          fi
          export ANDROID_NDK_HOME="$sdk_root/ndk/$RESOLVED_NDK_VERSION"
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::Resolved ANDROID_NDK_HOME ($ANDROID_NDK_HOME) does not exist — did the 'Install the resolved NDK' step succeed?"
            exit 1
          fi
          cargo ndk -t arm64-v8a -o "$GITHUB_WORKSPACE/android-output" build --release

      # Google Play has required 16 KB page alignment for native code since
      # 2025-11-01. this reads every PT_LOAD segment's alignment out of the
      # ELF program headers with readelf and fails the job unless the
      # largest one is at least 16384 bytes — which is exactly what the
      # linker flag above controls: on the r27.1.12297006 NDK this job just
      # installed (pre-r28, 4 KB-aligned by default), removing that flag
      # makes every LOAD segment's alignment 0x1000 (4096) and this step
      # fail, which is how this check is known to actually have teeth rather
      # than being unconditionally green.
      - name: Verify 16 KB Page Alignment
        run: |
          set -euo pipefail
          so_path="android-output/arm64-v8a/libespada_engine.so"
          if [ ! -f "$so_path" ]; then
            echo "::error::Expected build output at $so_path but it does not exist — the cross-compile step must have failed to produce it."
            exit 1
          fi
          max_align=0
          load_count=0
          while read -r align_hex; do
            load_count=$((load_count + 1))
            align_dec=$((16#${align_hex#0x}))
            if [ "$align_dec" -gt "$max_align" ]; then
              max_align=$align_dec
            fi
          done < <(readelf -lW "$so_path" | awk '$1 == "LOAD" { print $NF }')
          if [ "$load_count" -eq 0 ]; then
            echo "::error::readelf found no LOAD segments in $so_path — cannot verify page alignment."
            exit 1
          fi
          echo "Largest LOAD segment alignment: $max_align bytes (across $load_count LOAD segments)."
          if [ "$max_align" -lt 16384 ]; then
            echo "::error::$so_path is not 16 KB page aligned (largest LOAD segment alignment is $max_align bytes, need at least 16384). Google Play has required 16 KB alignment for native code since 2025-11-01."
            exit 1
          fi
          echo "16 KB page alignment verified."

      # compares, as sorted sets, the `#[no_mangle] pub extern "C" fn` /
      # `pub unsafe extern "C" fn` names declared across every .rs file in
      # modules/espada-engine/lib/espada-engine/src/ against this build's
      # own dynamic symbols — the same comparison this project's former
      # local rebuild script ran before this workflow existed. this is a
      # fresh build's own symbols, not the committed binary's, so it exists
      # to keep this job from ever uploading a wrong-symbol artifact — the
      # failure mode this project actually hit once, a committed .so that
      # kept exporting the old `juicio_native_*` names after the C ABI was
      # renamed to `espada_engine_*` — for commit-to-branch to then commit
      # unnoticed.
      #
      # this is now the only place the two sides of the C ABI are ever
      # compared. merge-checks.yaml's abi-parity job ran the same comparison
      # against the already-committed .so on an ordinary pull request; it has
      # been removed and nothing replaced it, so between dispatches a
      # committed .so can drift from those FFI source files with nothing
      # noticing.
      - name: Verify Exported C ABI
        run: |
          set -euo pipefail
          ffi_src_dir="modules/espada-engine/lib/espada-engine/src"
          so_path="android-output/arm64-v8a/libespada_engine.so"

          expected=$(grep -ohE '^pub (unsafe )?extern "C" fn [A-Za-z0-9_]+' "$ffi_src_dir"/*.rs | awk '{print $NF}' | sort -u)
          # captured with an explicit status check for the same reason the iOS
          # slice check below spells out: a bare `x=$(cmd | ...)` under
          # `set -euo pipefail` dies on that line with no diagnostic if `cmd`
          # fails.
          readelf_out=$(readelf -sW "$so_path" 2>&1) || {
            echo "::error::readelf failed on $so_path. Its output follows."
            printf '%s\n' "$readelf_out"
            exit 1
          }
          actual=$(printf '%s\n' "$readelf_out" | awk '$4 == "FUNC" && $5 == "GLOBAL" && $7 != "UND" { print $NF }' | sort -u)

          if [ "$expected" != "$actual" ]; then
            echo "::error::$so_path's exported C ABI symbols do not match $ffi_src_dir/*.rs. Refusing to upload a wrong-symbol binary."
            echo "Expected (from $ffi_src_dir/*.rs):"
            echo "$expected" | sed 's/^/  /'
            echo "Found (in the built .so):"
            echo "$actual" | sed 's/^/  /'
            exit 1
          fi

          echo "Exported C ABI symbols verified:"
          echo "$expected" | sed 's/^/  /'

      - name: Upload Android Binary
        uses: actions/upload-artifact@v7
        with:
          name: android-so
          path: android-output/arm64-v8a/libespada_engine.so
          if-no-files-found: error

  build-ios:
    name: Build iOS (.xcframework)
    needs: preflight
    runs-on: macos-latest
    # roughly double this job's own estimated duration: two release
    # cross-compiles under `lto = "fat"` on a macOS runner, which is
    # meaningfully slower per compute-unit than ubuntu-latest and bills at
    # roughly 10x its per-minute rate (see this file's own header comment).
    # no run of this job has completed yet to measure against, so this is an
    # estimate, not an observed figure.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          cache-key-prefix: cargo-ios

      # --manifest-path now points directly at espada-engine's own Cargo.toml,
      # not at a workspace root over two crates (see
      # docs/decisions/2026-08-28-fork-espada-and-give-each-library-its-own-directory.md),
      # so there is no longer a `-p` flag to give it: this manifest declares
      # exactly one package, and cargo builds it whether or not `-p` names it.
      # espada-internal is still compiled here — it is a path dependency of
      # espada-engine — which is what proves the fork cross-compiles for
      # Apple targets at all.
      - name: Build aarch64-apple-ios Slice (Device)
        run: cargo build --release --target aarch64-apple-ios --manifest-path modules/espada-engine/lib/espada-engine/Cargo.toml

      - name: Build aarch64-apple-ios-sim Slice (Simulator)
        run: cargo build --release --target aarch64-apple-ios-sim --manifest-path modules/espada-engine/lib/espada-engine/Cargo.toml

      # verifies each Apple slice's own exported C ABI against every .rs
      # file directly under modules/espada-engine/lib/espada-engine/src/ —
      # the iOS counterpart of the Android job's own exported-symbol check
      # above, carried over from this project's former local rebuild
      # script's own iOS symbol check (that script never had CI to move
      # this into before now). unlike the Android check, this is a subset check,
      # not an exact-set one: a .a is an intermediate build artifact, not a
      # fully linked binary, and legitimately carries many other global
      # (mangled) Rust symbols a cdylib's dynamic symbol table would not.
      # what must still never be true is this project's own past incident —
      # an expected C ABI name missing or renamed — so this refuses only a
      # *missing* expected symbol, never the presence of others. Mach-O
      # symbol names in nm's own output carry a leading underscore
      # (`_espada_engine_start`), unlike the ELF names the Android job reads
      # directly, which is what the `sed 's/^_//'` below accounts for.
      #
      # carried over verbatim from the deleted script's own
      # check_ios_exported_symbols. this job has since produced the .a slices
      # and the committed .xcframework — see
      # docs/operations/native-module-artifacts.md's "Both Binaries Now
      # Exist, and How They Got Here" — so this check has run against a real
      # build.
      - name: Verify Exported C ABI
        run: |
          set -euo pipefail
          ffi_src_dir="modules/espada-engine/lib/espada-engine/src"
          expected=$(grep -ohE '^pub (unsafe )?extern "C" fn [A-Za-z0-9_]+' "$ffi_src_dir"/*.rs | awk '{print $NF}' | sort -u)

          # Xcode's own `nm` cannot read these archives, and that is not a
          # defect in them. Rust's distributed sysroot rlibs carry an embedded
          # `__bitcode` section beside `__text`, and Apple's nm parses that
          # section as LLVM IR. Rust 1.98 emits it with LLVM 22; Xcode 26
          # reads with an older LLVM and aborts:
          #
          #   nm: error: ...rcgu.o: Unknown attribute kind (105)
          #   (Producer: 'LLVM22.1.8-rust-1.98.0-stable' Reader: 'LLVM APPLE_...')
          #
          # the native code is present and intact — verified by extracting
          # this exact archive, built with the same toolchain, and finding all
          # 393 members to be Mach-O objects carrying `__text`, none of them
          # bitcode-only. Apple's linker uses `__text` and ignores `__bitcode`
          # (Apple dropped bitcode in Xcode 14), so this never affected
          # linking, only inspection.
          #
          # so the check reads with the version-matched llvm-nm from the same
          # Rust toolchain that produced the archive. suppressing the embedded
          # bitcode instead is not available: `-C embed-bitcode=no` combined
          # with `-C lto` makes rustc abort at start-up, and the release
          # profile sets `lto = "fat"`.
          rustup component add llvm-tools-preview
          LLVM_NM=$(find "$(rustc --print sysroot)" -name llvm-nm -type f | head -1)
          if [ -z "$LLVM_NM" ]; then
            echo "::error::llvm-nm not found under $(rustc --print sysroot) after installing llvm-tools-preview."
            exit 1
          fi
          echo "Using $LLVM_NM"

          # llvm-nm's status and output are captured rather than discarded, and its
          # stderr is folded into stdout. the previous shape of this check —
          # `found=$(nm -gU "$lib" 2>/dev/null | ...)` under `set -euo
          # pipefail` — could not report its own failure: pipefail propagated
          # nm's exit status out of the assignment, `set -e` killed the script
          # on that line, and the discarded stderr meant the log recorded no
          # reason at all. its first real run did exactly that, printing
          # nothing whatsoever. a check that cannot say why it failed is worth
          # little more than no check.
          check_slice() {
            local lib_path="$1"
            local found raw rc=0

            if [ ! -f "$lib_path" ]; then
              echo "::error::Expected a static library at $lib_path but no such file exists. The cargo build step above must not have produced it where this check looks."
              ls -l "$(dirname "$lib_path")" || true
              exit 1
            fi
            echo "Inspecting $lib_path ($(file -b "$lib_path"), $(wc -c <"$lib_path") bytes)."

            raw=$("$LLVM_NM" -gU "$lib_path" 2>&1) || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::llvm-nm exited $rc on $lib_path. Its output follows."
              printf '%s\n' "$raw"
              exit 1
            fi

            # two filters, both load-bearing. NF>=3 drops llvm-nm's per-member
            # heading lines ("<archive>:<member>.o:"), which carry no symbol.
            # dropping "no symbols" lines matters for the same reason and is
            # less obvious: they are three fields wide, so NF>=3 keeps them and
            # the word "symbols" lands in the set as a bogus symbol name. the
            # leading underscore is Mach-O's C symbol decoration.
            found=$(printf '%s\n' "$raw" \
              | grep -v ': no symbols$' \
              | awk 'NF>=3 {print $NF}' \
              | sed 's/^_//' | sort -u)

            # only this module's own C ABI namespace is echoed. the archive
            # statically links the Rust standard library, so the full set runs
            # to several thousand symbols — printing it buries the job log
            # without telling anyone anything.
            echo "Defined global symbols in this module's namespace ($(printf '%s\n' "$found" | grep -c . ) total defined):"
            printf '%s\n' "$found" | grep '^espada_engine' | sed 's/^/  /'

            local missing=""
            while IFS= read -r symbol; do
              [ -z "$symbol" ] && continue
              if ! printf '%s\n' "$found" | grep -qx "$symbol"; then
                missing="$missing $symbol"
              fi
            done <<<"$expected"

            if [ -n "$missing" ]; then
              echo "::error::$lib_path is missing expected C ABI symbol(s) from $ffi_src_dir/*.rs:$missing. Refusing to upload a wrong-symbol binary."
              exit 1
            fi
            echo "Exported C ABI symbols verified for $lib_path."
          }

          check_slice "modules/espada-engine/lib/espada-engine/target/aarch64-apple-ios/release/libespada_engine.a"
          check_slice "modules/espada-engine/lib/espada-engine/target/aarch64-apple-ios-sim/release/libespada_engine.a"

      # lipo cannot merge these two static libraries: it keys on CPU
      # architecture alone and both slices are arm64, so an .xcframework is
      # the only mechanism that can carry both — not a preference. no
      # `-headers` argument: the C header this static library implements
      # (modules/espada-engine/lib/bridge/espada_engine.h) is already compiled
      # in directly through the podspec's own `source_files`, not through the
      # xcframework, matching that podspec's own header comment.
      - name: Assemble EspadaEngine.xcframework
        run: |
          set -euo pipefail
          rm -rf EspadaEngine.xcframework
          xcodebuild -create-xcframework \
            -library modules/espada-engine/lib/espada-engine/target/aarch64-apple-ios/release/libespada_engine.a \
            -library modules/espada-engine/lib/espada-engine/target/aarch64-apple-ios-sim/release/libespada_engine.a \
            -output EspadaEngine.xcframework

      - name: Verify XCFramework Slice Count
        run: |
          set -euo pipefail
          plist="EspadaEngine.xcframework/Info.plist"
          if [ ! -f "$plist" ]; then
            echo "::error::Expected $plist to exist after xcodebuild -create-xcframework."
            exit 1
          fi
          identifiers=$(/usr/libexec/PlistBuddy -c "Print :AvailableLibraries" "$plist" 2>/dev/null | grep "LibraryIdentifier" | sed -E 's/.*LibraryIdentifier = //')
          echo "Slices found:"
          echo "$identifiers"
          slice_count=$(printf '%s\n' "$identifiers" | grep -c . || true)
          if [ "$slice_count" -ne 2 ]; then
            echo "::error::Expected exactly 2 slices, found $slice_count: $identifiers"
            exit 1
          fi
          if ! printf '%s\n' "$identifiers" | grep -qx "ios-arm64"; then
            echo "::error::Missing the ios-arm64 (device) slice. Found: $identifiers"
            exit 1
          fi
          if ! printf '%s\n' "$identifiers" | grep -qx "ios-arm64-simulator"; then
            echo "::error::Missing the ios-arm64-simulator slice. Found: $identifiers"
            exit 1
          fi

      - name: Upload iOS XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcframework
          path: EspadaEngine.xcframework
          if-no-files-found: error

  generate-bindings:
    name: Generate Nitro Bindings
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # deliberately no further `needs:` here beyond `preflight`. Nitrogen
    # (`npm run nitrogen:espada-engine`) reads only modules/espada-engine's
    # TypeScript `.nitro.ts` spec and its nitro.json — it invokes no Rust
    # toolchain and produces no binary — and neither Rust cross-compile above
    # reads this job's generated output. there is no dependency between this
    # job and build-android/build-ios in either direction, so it genuinely
    # can run concurrently with them: do not add a `needs:` here to make it
    # "wait for the binaries first," there is nothing for it to wait on.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true

      - name: Generate Nitrogen Bindings
        run: npm run nitrogen:espada-engine

      - name: Upload Generated Bindings
        uses: actions/upload-artifact@v7
        with:
          name: nitrogen-generated
          path: modules/espada-engine/nitrogen/generated/
          if-no-files-found: error
          # Nitrogen writes a .gitattributes marking this whole tree
          # linguist-generated, and upload-artifact excludes hidden files by
          # default. without this the file never reaches the commit job,
          # whose `rm -rf` + copy then deletes it from the committed tree — as
          # it did on this workflow's first successful run.
          include-hidden-files: true

  verify-android:
    name: Verify Android Compile
    needs: [preflight, build-android, generate-bindings]
    runs-on: ubuntu-latest
    # roughly double an estimated assemble time for a full Gradle
    # assembleDebug of the generated Android project — this is
    # merge-checks.yaml's former native_android_compile job, moved here
    # unchanged in shape; that job never carried its own timeout-minutes
    # before this convention existed, so there is no prior observed duration
    # to double against.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Android Binary
        uses: actions/download-artifact@v8
        with:
          name: android-so
          path: modules/espada-engine/android/src/main/jniLibs/arm64-v8a

      - name: Download Nitro Bindings
        uses: actions/download-artifact@v8
        with:
          name: nitrogen-generated
          path: downloaded/nitrogen-generated

      # replaced wholesale, mirroring commit-to-branch's own placement of
      # this same artifact below: a file Nitrogen no longer generates must
      # actually disappear from this checkout, not linger from what the
      # default branch already has committed.
      - name: Place Nitro Bindings
        run: |
          set -euo pipefail
          rm -rf modules/espada-engine/nitrogen/generated
          cp -R downloaded/nitrogen-generated modules/espada-engine/nitrogen/generated

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true

      - name: Setup Android Toolchain
        uses: ./.github/actions/setup-android-toolchain

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-verify-android-${{ hashFiles('package-lock.json') }}

      # reuses android-preview.yaml's own reclamation step (see that file's
      # header comment for the full rationale): this job's Gradle assemble
      # compiles the same NDK C++ target — this module's own CMakeLists.txt,
      # Nitro's published prefab package, and the .so this job downloaded and
      # placed above — that once ran that pipeline's runner out of disk
      # entirely mid-compile. budgeted for deliberately here, before it is
      # discovered the same way a second time.
      - name: Reclaim Disk Space
        uses: ./.github/actions/reclaim-disk-space

      # this is the check that actually compiles the C++: it exercises the
      # espada-engine HybridObject, this module's CMakeLists.txt, Nitro's
      # prefab link, and the packaging of the .so this job downloaded from
      # build-android and placed above — proving all of that links and
      # packages before commit-to-branch ever commits it. it needs no
      # repository secret: a debug assemble signs with Gradle's own ad hoc
      # debug keystore, generated on the fly, never one of this project's own
      # signing secrets.
      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: Assemble Debug Android Build
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      # Google Play has required 16 KB page alignment for native code since
      # 2025-11-01, exactly as build-android's own "Verify 16 KB Page
      # Alignment" step above states — that step is left alone, and still
      # checks the freshly cross-compiled Rust .so at the point it is
      # produced. This step is what actually proves the C++ side: it reads
      # the same PT_LOAD alignment out of both libraries this project
      # builds — libEspadaEngine.so, this module's own CMakeLists.txt
      # target, compiled fresh by this job's own Gradle assemble above, and
      # libespada_engine.so, the Rust cdylib linked into the same build —
      # extracted from the assembled APK itself, a stable output path and
      # what actually ships. It checks these two by name rather than every
      # arm64 .so the assembled build produces; for why a dependency-owned
      # library is deliberately outside that scope, see
      # docs/decisions/2026-09-02-scope-the-page-alignment-gate-to-this-projects-own-libraries.md.
      # Extracting each library on its own rather than
      # both in one `unzip` call matters: unzip exits non-zero the moment any
      # named entry is missing, which would abort the whole step under
      # `set -e` before either library got a properly named error; each is
      # extracted with `|| true` and then checked for existence instead, so
      # a missing library fails with the message below rather than a bare
      # unzip diagnostic.
      - name: Verify 16 KB Page Alignment
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk_path" ]; then
            echo "::error::Expected assembled APK at $apk_path but it does not exist — the Gradle assemble step must have failed to produce it."
            exit 1
          fi
          work_dir=$(mktemp -d)
          failed=0
          for lib_name in libEspadaEngine.so libespada_engine.so; do
            unzip -q "$apk_path" "lib/arm64-v8a/$lib_name" -d "$work_dir" || true
            so_path="$work_dir/lib/arm64-v8a/$lib_name"
            if [ ! -f "$so_path" ]; then
              echo "::error::$lib_name is missing from lib/arm64-v8a/ in the assembled APK ($apk_path)."
              failed=1
              continue
            fi
            max_align=0
            load_count=0
            while read -r align_hex; do
              load_count=$((load_count + 1))
              align_dec=$((16#${align_hex#0x}))
              if [ "$align_dec" -gt "$max_align" ]; then
                max_align=$align_dec
              fi
            done < <(readelf -lW "$so_path" | awk '$1 == "LOAD" { print $NF }')
            if [ "$load_count" -eq 0 ]; then
              echo "::error::readelf found no LOAD segments in $lib_name — cannot verify page alignment."
              failed=1
              continue
            fi
            echo "$lib_name: largest LOAD segment alignment is $max_align bytes (across $load_count LOAD segments)."
            if [ "$max_align" -lt 16384 ]; then
              echo "::error::$lib_name is not 16 KB page aligned (largest LOAD segment alignment is $max_align bytes, need at least 16384). Google Play has required 16 KB alignment for native code since 2025-11-01."
              failed=1
            fi
          done
          rm -rf "$work_dir"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "16 KB page alignment verified for both libraries."

      - name: Report Free Disk Space (After Build)
        if: always()
        run: df -h

  verify-ios:
    name: Verify iOS Compile
    needs: [preflight, build-ios, generate-bindings]
    runs-on: macos-latest
    # this project's former ios-native-compile.yaml carried no
    # timeout-minutes of its own (this convention postdates it) and has never
    # completed a run to measure against — see this file's header comment on
    # why verify-ios is a hard gate despite that. sized generously rather
    # than tightly: an Xcode build on a macOS runner is the slowest and
    # least-proven step in this workflow, and a ceiling set too tight would
    # abort a slow-but-succeeding first run rather than catch a genuine hang.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download iOS XCFramework
        uses: actions/download-artifact@v8
        with:
          name: ios-xcframework
          path: downloaded/ios/EspadaEngine.xcframework

      # every destination's parent is created first, and the destination is
      # removed before the copy, for the same reason commit-to-branch's own
      # placement step below is: git tracks no empty directories, and
      # modules/espada-engine/ios/ holds nothing but this .xcframework, so on
      # a checkout where it has never been committed the directory does not
      # exist at all and a plain `cp -R` fails with "No such file or
      # directory".
      - name: Place iOS XCFramework
        run: |
          set -euo pipefail
          mkdir -p modules/espada-engine/ios
          rm -rf modules/espada-engine/ios/EspadaEngine.xcframework
          cp -R downloaded/ios/EspadaEngine.xcframework modules/espada-engine/ios/EspadaEngine.xcframework

      - name: Download Nitro Bindings
        uses: actions/download-artifact@v8
        with:
          name: nitrogen-generated
          path: downloaded/nitrogen-generated

      # replaced wholesale for the same reason the Android compile job's own
      # placement step is: a file Nitrogen no longer generates must actually
      # disappear from this checkout, not linger and mask a spec change that
      # removed it.
      - name: Place Nitro Bindings
        run: |
          set -euo pipefail
          rm -rf modules/espada-engine/nitrogen/generated
          cp -R downloaded/nitrogen-generated modules/espada-engine/nitrogen/generated

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true

      - name: Generate Native iOS Project
        run: npx expo prebuild --platform ios --no-install

      # macos-latest ships CocoaPods preinstalled — the same assumption
      # ios-preview.yaml's own "Install CocoaPods Dependencies" step makes,
      # with no explicit CocoaPods install step of its own. this is also the
      # step that proves EspadaEngine.podspec resolves at all: it fails
      # loudly (CocoaPods' own diagnostic, not swallowed) if `source_files`,
      # `vendored_frameworks`, or the `add_nitrogen_files` load fail to
      # resolve.
      - name: Install CocoaPods Dependencies
        working-directory: ios
        run: pod install

      # derived by glob, never hardcoded — the same lookup
      # fastlane/Fastfile's `resolved_ios_project_paths` (lines 53-63) uses
      # for the exact reason its own comment gives: a hardcoded project name
      # silently stops matching the moment app.json's name changes, and
      # nothing would say why. this job does not call into fastlane at all,
      # so the same glob-then-fail-loud shape is reimplemented directly here
      # rather than shared code, mirroring how this workflow's own
      # verify-android job also bypasses fastlane for its own raw Gradle
      # invocation.
      - name: Resolve Workspace and Scheme
        id: resolve
        run: |
          set -euo pipefail
          workspace_path=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          if [ -z "$workspace_path" ]; then
            echo "::error::No .xcworkspace found under ios/ after pod install. Expected CocoaPods to generate one alongside the Podfile — see fastlane/Fastfile's resolved_ios_project_paths for the same lookup ios-preview.yaml's build lane depends on."
            exit 1
          fi
          scheme=$(basename "$workspace_path" .xcworkspace)
          echo "Resolved workspace $workspace_path, scheme $scheme"
          echo "workspace-path=$workspace_path" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      # -sdk iphonesimulator plus -destination 'generic/platform=iOS
      # Simulator' builds for the Simulator without needing one booted or
      # even present on the runner — the same generic-destination mechanism
      # Apple's own xcodebuild documentation states for building against a
      # platform generically instead of a specific device. CODE_SIGNING_ALLOWED=NO
      # is the flag this repository's own iOS pipeline never needs (its
      # signed builds import a real certificate and profile instead — see
      # ios-preview.yaml) but this one does: a Simulator build has no signing
      # identity or provisioning profile available at all, and this setting
      # is what stops Xcode's generated project — which defaults to
      # "Automatically manage signing" — from trying to resolve either one.
      # -configuration Debug matches every other unsigned/local iOS build in
      # this project (`npm run ios`) and, unlike Release, does not invoke the
      # React Native bundling build phase, which needs a running Metro server
      # this job never starts.
      - name: Compile for iOS Simulator
        run: |
          set -euo pipefail
          #
          # ARCHS=arm64 is not an optimisation — without it this build asks
          # for something this project deliberately does not ship. a generic
          # Simulator destination makes Xcode link every valid Simulator
          # architecture, x86_64 included, and EspadaEngine.xcframework
          # carries only `ios-arm64` and `ios-arm64-simulator`, because
          # supporting the Intel-Mac Simulator is an explicit non-goal of
          # this module's plan (issue #7).
          #
          # the first run of this compile failed exactly there, and the
          # message is worth recognising: `ld: library 'espada_engine' not
          # found` for the x86_64 slice. that is a library-not-found error,
          # not undefined symbols — the linker never opened the archive,
          # because for that architecture there was nothing to open.
          #
          # if the Intel Simulator ever comes into scope, the fix is a third
          # slice in the xcframework, not a change here.
          xcodebuild build \
            -workspace "${{ steps.resolve.outputs.workspace-path }}" \
            -scheme "${{ steps.resolve.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

  commit-to-branch:
    name: Commit to Branch
    needs: [preflight, build-android, build-ios, generate-bindings, verify-android, verify-ios]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write # to push the commit onto the dispatched branch
    steps:
      # a plain checkout, no `ref:` override, resolves to the same commit
      # GitHub already fixed for this whole run at dispatch time — exactly
      # like every build and verify job above, and the same behavior
      # android-release.yaml's own header comment documents and relies on
      # for its own branch-only dispatch. that is what makes the push step's
      # own non-fast-forward guard actually mean what its comment says: a
      # branch tip that moved past this commit while this run was in flight
      # is rejected loudly, not silently fast-forwarded past.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Android Binary
        uses: actions/download-artifact@v8
        with:
          name: android-so
          path: downloaded/android

      - name: Download iOS XCFramework
        uses: actions/download-artifact@v8
        with:
          name: ios-xcframework
          path: downloaded/ios/EspadaEngine.xcframework

      - name: Download Nitro Bindings
        uses: actions/download-artifact@v8
        with:
          name: nitrogen-generated
          path: downloaded/nitrogen-generated

      - name: Commit Artifacts to Branch
        id: commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          android_dest="modules/espada-engine/android/src/main/jniLibs/arm64-v8a/libespada_engine.so"
          ios_dest="modules/espada-engine/ios/EspadaEngine.xcframework"
          nitrogen_dest="modules/espada-engine/nitrogen/generated"

          echo "android-dest=${android_dest}" >> "$GITHUB_OUTPUT"
          echo "ios-dest=${ios_dest}" >> "$GITHUB_OUTPUT"
          echo "nitrogen-dest=${nitrogen_dest}" >> "$GITHUB_OUTPUT"

          # every destination's parent is created first. this is not
          # defensive noise for the iOS one: git does not track empty
          # directories, and modules/espada-engine/ios/ holds nothing but the
          # .xcframework this job is about to write — so on a checkout where
          # that artifact has never been committed, the directory does not
          # exist at all and `cp -R` fails with "No such file or directory".
          # that is exactly how this job failed on its first successful build
          # of all three artifacts.
          mkdir -p "$(dirname "$android_dest")" "$(dirname "$ios_dest")" "$(dirname "$nitrogen_dest")"

          cp downloaded/android/libespada_engine.so "$android_dest"

          rm -rf "$ios_dest"
          cp -R downloaded/ios/EspadaEngine.xcframework "$ios_dest"

          # replaced wholesale, not merged: a file Nitrogen no longer
          # generates (a spec removed, a renamed method) must actually
          # disappear from the committed tree rather than lingering as a
          # stale leftover a plain copy-over would leave behind.
          rm -rf "$nitrogen_dest"
          cp -R downloaded/nitrogen-generated "$nitrogen_dest"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `git add <path>` also stages a removed file's deletion for any
          # tracked path already gone from the working tree (Git 2.0+), not
          # only new and modified content — which is what makes the
          # nitrogen_dest replacement above actually remove a dropped
          # generated file from the index, not just leave it untracked.
          git add "$android_dest" "$ios_dest" "$nitrogen_dest"

          # nothing to commit is a success, not a failure. it means every
          # artifact this run produced is byte-identical to what is already
          # committed — which is the expected outcome whenever this workflow
          # is dispatched to re-verify rather than to update, for instance to
          # confirm the iOS compile still passes after a change to the
          # workflow itself. committing an empty change, and reporting about
          # it, would be wrong; failing the run would report a healthy build
          # as broken, and would make re-verification cost a red run every
          # time.
          #
          # a genuinely empty build cannot reach here: the copy steps above
          # fail if an artifact is missing, and verify-android and verify-ios
          # must both have passed for this job to run at all.
          if git diff --cached --quiet; then
            echo "Every artifact is byte-identical to what is already committed — nothing to commit; ${BRANCH} is unchanged."
            echo "::notice::Artifacts already up to date; nothing committed."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(native): commit espada-engine binaries and generated bindings built from ${SOURCE_COMMIT}"

          # no `-f`/force: this pushes onto the dispatched branch by name,
          # built on top of the checkout above (the commit GitHub fixed for
          # this run at dispatch time), so a non-fast-forward rejection here
          # means a human (or another run) pushed to that same branch at any
          # point since this run was dispatched — anywhere across this whole
          # run's build-and-verify window, not only after this job itself
          # started — and that should fail loudly, not force-overwrite
          # whatever they pushed.
          git push origin "HEAD:refs/heads/${BRANCH}"

          echo "committed=true" >> "$GITHUB_OUTPUT"

      # gated on the commit step's own output, so a run that committed
      # nothing writes no summary at all — mirroring android-preview.yaml's
      # and ios-preview.yaml's own install-link comment, gated the same way
      # on their publish step's output. this is a run's own job summary, not
      # a GitHub comment, so it carries none of this project's `<!-- agent
      # -->` comment marker: that convention (see AGENTS.md) applies to a
      # GitHub issue or pull request comment, not a step summary.
      - name: Write Commit Summary
        if: steps.commit.outputs.committed == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          ANDROID_DEST: ${{ steps.commit.outputs.android-dest }}
          IOS_DEST: ${{ steps.commit.outputs.ios-dest }}
          NITROGEN_DEST: ${{ steps.commit.outputs.nitrogen-dest }}
        run: |
          {
            echo "### Espada Engine Artifacts Committed"
            echo "Committed the Android \`.so\`, the iOS \`.xcframework\`, and the generated Nitro bindings this workflow just built and generated from \`modules/espada-engine\` at commit \`${SOURCE_COMMIT}\`, onto \`${BRANCH}\`."
            echo ""
            echo "- \`${ANDROID_DEST}\`"
            echo "- \`${IOS_DEST}\`"
            echo "- \`${NITROGEN_DEST}/\`"
            echo ""
            echo "Pushed with the default \`GITHUB_TOKEN\`, so if a pull request happens to be open for \`${BRANCH}\`, each of this repository's three merge-check workflows (Expo, Rust, and Docs Merge Checks) has created its own run against it, each waiting for approval rather than starting on its own. Approve them from that pull request's page to run the ordinary checks; nothing needs to be pushed or reopened. If there is no pending run left to approve — GitHub deletes runs awaiting approval after 30 days — close and reopen that pull request to create fresh ones."
            echo "Those checks say nothing about the binaries themselves: this workflow's own alignment, symbol, slice-count, and compile checks are what verified them, before this commit landed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Committed espada-engine artifacts from ${SOURCE_COMMIT} to ${BRANCH}."
