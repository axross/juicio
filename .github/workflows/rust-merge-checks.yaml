name: Rust Merge Checks

# This project's own CI for modules/espada-engine/lib/'s two Rust crates: one
# job per tool, run against both crates. This is one of three workflows split
# from a single former merge-checks.yaml — see
# docs/decisions/2026-08-28-split-merge-checks-into-three-domain-workflows.md
# for why. Together with expo-merge-checks.yaml and docs-merge-checks.yaml
# this is the CI loop-engineering's tail polls after a push (see
# .claude/skills/loop-engineering/SKILL.md). Keep REVIEW.md's do-not-report
# list in sync with exactly what these jobs enforce.
#
# `lib/` no longer holds one Cargo workspace over both crates (see
# docs/decisions/2026-08-28-fork-espada-and-give-each-library-its-own-directory.md):
# espada-engine and espada-internal each carry their own manifest and
# lockfile now, so there is no single `--workspace` or `-p` flag left to
# scope against — every command below names its own crate's `--manifest-path`
# instead, six invocations rather than three. Format and lint used to be
# scoped away from espada-internal, because it was a verbatim copy of
# axross/espada and the only way to satisfy a gate the copy failed was to
# edit the copy — which would have made it no longer diffable against
# upstream. That reason is gone: espada-internal is a fork maintained in this
# repository now, so it is held to the same format and lint gates as
# espada-engine, the same way any other crate here is. Before this workflow's
# predecessor existed, none of the three checks ran in CI at all (see
# README.md's Testing checks table and docs/conventions/testing.md), so a
# regression in this module's Rust was caught by nobody until someone
# happened to run these by hand. All commands below run on the host — no
# Android toolchain, no macOS runner, no repository secret.
#
# Nothing in this workflow looks at modules/espada-engine/'s committed
# artifacts. It does not regenerate the Nitro bindings and compare them
# against the spec, it does not compare the committed Android .so's exported
# symbols against ffi.rs, and it does not flag a hand-edited binary. Those
# three checks were removed from this project's CI and nothing replaced them;
# README.md's Testing section states what each one used to cover.
#
# `on:` deliberately carries no `paths:` filter; every job below is gated
# instead by the `changes` job's per-filter output and a job-level `if:`.
# `changes` runs `dorny/paths-filter` once and emits one boolean output per
# filter this workflow's own jobs consume; every other job declares
# `needs: changes` and an `if:` reading the matching output, so only the
# jobs whose inputs actually changed do any work. `changes` itself carries
# no `if:` and must fail loudly rather than resolve silently; every job
# here is gated that way, none carries a condition of its own. For why
# `paths:` itself is avoided, and what each of `changes`'s two failure modes
# costs, see
# docs/decisions/2026-08-28-scope-ci-jobs-by-job-level-if-not-workflow-paths-filters.md
# and docs/decisions/2026-08-28-split-merge-checks-into-three-domain-workflows.md.

on:
  pull_request:
  push:
    branches: [main] # the project's default branch

# `cancel-in-progress` applies to `pull_request` events only — cancelling a
# push run on the default branch would leave a merged commit's checks never
# completing. `group` is per-workflow via `github.workflow`, so a superseded
# run on one domain workflow no longer cancels an in-flight run on another;
# see docs/decisions/2026-08-28-split-merge-checks-into-three-domain-workflows.md
# ("The cost this accepts") for why the three stayed independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Files
    # ubuntu-slim is a 1 vCPU / 5 GB container runner with a hard 15-minute
    # job ceiling that timeout-minutes cannot raise. This job runs only Node
    # built-ins, bash, or a JavaScript action — well inside that budget.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter needs this to fetch a pull request's changed
      # files from the GitHub REST API instead of local git history.
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      # Needed only for the push-to-main case, where dorny/paths-filter
      # diffs against the previous commit using local git history; a
      # pull_request event instead uses the GitHub REST API and needs no
      # checkout at all.
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect Changed Files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              # Both Rust crates under modules/espada-engine/lib/, each with
              # its own manifest and lockfile now that the Cargo workspace
              # over them is dissolved (see
              # docs/decisions/2026-08-28-fork-espada-and-give-each-library-its-own-directory.md).
              # espada-internal is a fork maintained in this repository, not a
              # verbatim vendored copy, so its own format, lint and test gates
              # run in this job too — a pull request touching only it must
              # trigger these jobs the same as one touching only
              # espada-engine. lib/bridge/ is deliberately absent: it is C++,
              # and no Rust check reads it.
              - 'modules/espada-engine/lib/espada-engine/**'
              - 'modules/espada-engine/lib/espada-internal/**'

  # The Cargo cache is split across this job and `test` below rather than
  # shared, and the two `cache-key-prefix` values below (cargo-rust-lint,
  # cargo-rust-test) must stay distinct. .github/actions/setup-rust's cache
  # key is `<cache-key-prefix>-<hash of both Cargo.lock files>`, with no
  # restore-keys and no per-job component in the key — so a shared prefix
  # would make both jobs compute the identical key, race to save it when both
  # run in parallel from a cold cache, and both miss on restore. Do not
  # "tidy" these back into one prefix.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # This is an estimate, not a measurement: the former single rust-checks
    # job's own timeout-minutes of 3 was derived from measuring all six
    # Cargo commands running together in one job, and that measurement no
    # longer describes either job split out of it — this job now runs four
    # of the six commands, and it recompiles from its own cold cache
    # independently of `test` below rather than sharing its warm one. A
    # follow-up issue re-derives this figure from observed runs once the
    # split has actually run; treat 5 as a placeholder, not evidence.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
          cache-key-prefix: cargo-rust-lint
      - name: espada-engine — Rust Format Check
        run: cargo fmt --check --manifest-path modules/espada-engine/lib/espada-engine/Cargo.toml
      - name: espada-engine — Rust Lint
        run: cargo clippy --all-targets --manifest-path modules/espada-engine/lib/espada-engine/Cargo.toml -- -D warnings
      - name: espada-internal — Rust Format Check
        run: cargo fmt --check --manifest-path modules/espada-engine/lib/espada-internal/Cargo.toml
      - name: espada-internal — Rust Lint
        run: cargo clippy --all-targets --manifest-path modules/espada-engine/lib/espada-internal/Cargo.toml -- -D warnings

  test:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Estimate, not a measurement — see `lint`'s own comment above for why.
    # This job runs the two `cargo test` commands only, with no rustfmt or
    # clippy component to install, and its own cold cache to warm.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-prefix: cargo-rust-test
      - name: espada-engine — Rust Unit Tests
        run: cargo test --manifest-path modules/espada-engine/lib/espada-engine/Cargo.toml
      - name: espada-internal — Rust Unit Tests
        run: cargo test --manifest-path modules/espada-engine/lib/espada-internal/Cargo.toml
