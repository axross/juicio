name: Claude Code Review

# independent pull-request review. runs as a separate Claude Code session on a
# GitHub-hosted runner — a different session, on different infrastructure,
# under a bot identity distinct from the connected operator — triggered by a
# comment containing the review trigger phrase (`@claude review`). it bootstraps
# REVIEW.md at the repo root as the review policy. this is the authoritative
# review for the change loop (.claude/skills/loop-engineering/SKILL.md), which
# posts the trigger phrase after opening a PR and then addresses the findings
# this workflow leaves.
#
# changing the phrase means changing it in exactly two places, and nowhere
# else: the `contains(...)` check below, and the phrase loop-engineering
# itself posts, which lives in its installed (never hand-edited) SKILL.md —
# route that change upstream per docs/operations/agent-skills.md. every other
# document refers to it as "the review trigger phrase" rather than spelling
# it out, because a comment-triggered workflow matches the literal string
# anywhere in a comment body: a second spelling in a plan or a summary fires
# a duplicate review.
#
# note: issue_comment workflows run only from the version on the default
# branch, so this reviewer fires on PRs only once this file is merged there —
# the PR that introduces it cannot be reviewed by it.
#
# operator prerequisites (one-time; the workflow no-ops until both are done):
#   1. install the Claude GitHub App: https://github.com/apps/claude
#   2. generate a subscription token locally with `claude setup-token` and add
#      it as the repo secret CLAUDE_CODE_OAUTH_TOKEN
#      (Settings → Secrets and variables → Actions).
#      to use pay-as-you-go API billing instead of a subscription, set an
#      ANTHROPIC_API_KEY secret and swap the `claude_code_oauth_token` input
#      below for `anthropic_api_key`.

on:
  issue_comment:
    types: [created]

# safety property 1 of 3: least privilege, read-only contents. the reviewer
# can read code and write review output, nothing else. no contents:write — it
# never pushes, and its token cannot. pull-requests / issues / checks writes
# cover inline review comments, the summary comment, and the check-run
# respectively.
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  id-token: write # claude-code-action mints the Claude App token via OIDC

jobs:
  review:
    name: Review
    # safety property 1, continued: the author-association gate. only fire on:
    # a comment on a pull request (not a plain issue), containing the review
    # trigger phrase, from a trusted user (owner/member/collaborator) or from
    # the change loop's own bot identity. this keeps untrusted authors from
    # spending tokens or steering the reviewer. the association list itself is
    # unchanged and stays closed to every other author; one named bot identity
    # is admitted beside it, because a request posted through the installed
    # github app is authored by that identity and GitHub reports its
    # author_association as NONE for it, same as any outside commenter — a
    # request posted through a connected operator's own credentials carries
    # that operator's association instead and was never affected.
    #
    # the bot clause carries a second condition beyond the login match: the
    # comment must carry no markdown heading anywhere in it. the reviewer posts
    # its own summary under this same bot identity, so a login-only clause would
    # let that summary re-arm the gate it just fired from, whenever the summary's
    # prose happens to quote the trigger phrase — this has actually happened in
    # this repository. the loop's own request carries only the phrase and a
    # generated-by footer, with no heading anywhere in it, while every reviewer
    # summary opens with one, so the heading test is what tells a request apart
    # from the reviewer's own output. the test is written broad ('## ' rather than
    # the reviewer's specific heading) on purpose: it is meant to fail toward
    # skipping an unexpected bot comment rather than toward admitting one, because
    # an unbounded re-trigger chain costs more than a skipped request does. the
    # security rationale for both the bot clause and the heading test lives in
    # docs/decisions/2026-09-02-admit-the-agent-bot-identity-to-the-review-gate.md.
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       (github.event.comment.user.login == 'claude[bot]' &&
        !contains(github.event.comment.body, '## ')))
    # job-level (not workflow-level) concurrency: only a job that passes the
    # `if` gate joins the group, so an unrelated issue_comment — e.g. a
    # deploy-preview bot comment — skips the job and cannot cancel an in-flight
    # review. a fresh trigger comment still supersedes a running one.
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # safety property 2 of 3: base-ref checkout. check out the base ref (the
      # default branch), not the PR head: the review reads the diff through
      # the GitHub API, so untrusted head code is never executed on the
      # runner. the checkout only supplies CLAUDE.md / AGENTS.md, REVIEW.md,
      # and the project skills as trusted review context.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Claude Review
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1.0.211
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # the action's own actor check, distinct from the author-association
          # gate above: it rejects any bot-initiated run whose actor is not
          # named here, even one the `if:` gate already admitted. naming only
          # the change loop's own identity keeps every other bot rejected by
          # this guard too — allowed_bots: "*" was rejected because, per the
          # action's own input description, it would let any external App
          # invoke this action with prompts it controls.
          allowed_bots: "claude[bot]"
          # run the official code-review plugin against this PR. the plugin
          # posts only when invoked with `--comment`; without it, it analyzes
          # and stops silently. with `--comment` it posts inline comments via
          # mcp__github_inline_comment__create_inline_comment plus one
          # `gh pr comment` summary; it never submits a formal `gh pr review`.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }} --comment"
          # --allowedTools is required: the action does not honor a plugin
          # command's own `allowed-tools` frontmatter, so without this the
          # plugin is denied the tools it needs and posts nothing. allow
          # general `Bash`, not a narrow per-subcommand allow-list: the plugin
          # issues compound and non-gh shell commands to gather context, and
          # the permission matcher cannot match those to a single prefix. this
          # broad Bash is safe only because of safety property 2: the runner
          # only ever holds the trusted base tree, never the PR head, so no
          # untrusted code can execute; and the token is contents:read, so it
          # cannot push. Read/Grep/Glob let it inspect the base tree for
          # conventions and sibling files.
          claude_args: >-
            --append-system-prompt "Read REVIEW.md at the repository root and follow it as the highest-priority, review-only instructions for this review. Review this pull request even if it is a draft — do not skip it for being a draft. Do the ENTIRE review within this single turn: run every check and review pass yourself, synchronously and in order. Do NOT kick off background or parallel work and then end your turn to wait for it — this is a one-shot job that terminates the instant your turn ends, so anything you defer is lost and no review is posted. You MUST post your findings (inline comments plus a summary via `gh pr comment`) before your turn ends. This reviewer is advisory and does not gate merges."
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash"
            --disallowedTools "WebFetch,WebSearch,Task"
            --max-turns 200
          # safety property 3 of 3: background-task denial (--disallowedTools
          # above). denying Task forces a synchronous review that completes
          # and posts within the one turn: the plugin otherwise fans review
          # passes out to background sub-agents, and when the main agent ends
          # its turn while those still run, this single-shot action terminates
          # and orphans them — nothing posts. WebFetch/WebSearch stay
          # disallowed too (no external calls from the reviewer).
          #
          # turn count scales with PR size and is high-variance even on a tiny
          # diff, so size --max-turns for the worst case and let
          # `timeout-minutes: 30` be the real backstop; the cap only guards
          # against a pathological loop.
