name: Android Preview

# Builds a signed Android preview APK for a pull request a maintainer names
# and distributes it through Firebase App Distribution — no EAS, no
# production release path. See docs/operations/preview-deployment.md for the
# stage-by-stage picture, the artifact hand-off, and every secret and
# variable this file reads. Mirrors ios-preview.yaml's job shape; the two are
# kept as separate files rather than one matrixed workflow — see that
# document's Matrix vs. Two Files section.
#
# The dispatch is manual and always names a pull request. `preflight`
# resolves the pull request's head commit through the GitHub API rather than
# trusting the ref this run was dispatched from, and every later job checks
# out that resolved `head-sha` — never `refs/pull/<n>/head` again — so a push
# between jobs cannot change what gets built after the fork-origin guard
# approved it.

on:
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Pull request number to build and publish an Android preview for
        required: true
        type: number

concurrency:
  group: android-preview-${{ inputs.pull-request-number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      head-sha: ${{ steps.guard.outputs.head-sha }}
      version-name: ${{ steps.version.outputs.version-name }}
      sentry-configured: ${{ steps.check.outputs.sentry-configured }}
    steps:
      - name: Resolve required configuration
        id: check
        env:
          HAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
          HAS_FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID != '' }}
          HAS_SENTRY_ORG: ${{ vars.SENTRY_ORG != '' }}
          HAS_SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT != '' }}
          HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        run: |
          # Every HAS_* value above is a plain "true"/"false" string resolved
          # in env, never in an `if:` expression, so nothing below can echo a
          # secret's actual value.
          missing=()
          [ "$HAS_ANDROID_KEYSTORE_BASE64" = "true" ] || missing+=("ANDROID_KEYSTORE_BASE64 (secret)")
          [ "$HAS_ANDROID_KEYSTORE_PASSWORD" = "true" ] || missing+=("ANDROID_KEYSTORE_PASSWORD (secret)")
          [ "$HAS_ANDROID_KEY_ALIAS" = "true" ] || missing+=("ANDROID_KEY_ALIAS (secret)")
          [ "$HAS_ANDROID_KEY_PASSWORD" = "true" ] || missing+=("ANDROID_KEY_PASSWORD (secret)")
          [ "$HAS_FIREBASE_SERVICE_ACCOUNT_JSON" = "true" ] || missing+=("FIREBASE_SERVICE_ACCOUNT_JSON (secret)")
          [ "$HAS_FIREBASE_ANDROID_APP_ID" = "true" ] || missing+=("FIREBASE_ANDROID_APP_ID (variable)")

          sentry_missing=()
          [ "$HAS_SENTRY_ORG" = "true" ] || sentry_missing+=("SENTRY_ORG (variable)")
          [ "$HAS_SENTRY_PROJECT" = "true" ] || sentry_missing+=("SENTRY_PROJECT (variable)")
          [ "$HAS_SENTRY_AUTH_TOKEN" = "true" ] || sentry_missing+=("SENTRY_AUTH_TOKEN (secret)")

          {
            echo "### Android Preview Configuration"
            echo "| Entry | Kind | Present |"
            echo "| --- | --- | --- |"
            echo "| ANDROID_KEYSTORE_BASE64 | Secret | $HAS_ANDROID_KEYSTORE_BASE64 |"
            echo "| ANDROID_KEYSTORE_PASSWORD | Secret | $HAS_ANDROID_KEYSTORE_PASSWORD |"
            echo "| ANDROID_KEY_ALIAS | Secret | $HAS_ANDROID_KEY_ALIAS |"
            echo "| ANDROID_KEY_PASSWORD | Secret | $HAS_ANDROID_KEY_PASSWORD |"
            echo "| FIREBASE_SERVICE_ACCOUNT_JSON | Secret | $HAS_FIREBASE_SERVICE_ACCOUNT_JSON |"
            echo "| FIREBASE_ANDROID_APP_ID | Variable | $HAS_FIREBASE_ANDROID_APP_ID |"
            echo "| SENTRY_ORG | Variable | $HAS_SENTRY_ORG |"
            echo "| SENTRY_PROJECT | Variable | $HAS_SENTRY_PROJECT |"
            echo "| SENTRY_AUTH_TOKEN | Secret | $HAS_SENTRY_AUTH_TOKEN |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Sentry is resolved, and its own warning emitted, before the
          # required-configuration exit below — so an incomplete Sentry set
          # is never lost to a `preflight` failure it must not cause.
          if [ "${#sentry_missing[@]}" -eq 0 ]; then
            echo "sentry-configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "sentry-configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sentry source-map upload is not configured — skipping it. Missing: ${sentry_missing[*]}. The build and the Firebase publish still proceed; see docs/operations/preview-deployment.md."
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Android preview deployment is not configured — the following required configuration is missing (see docs/operations/preview-deployment.md and docs/operations/secrets.md):"
            for entry in "${missing[@]}"; do
              echo "::error::Missing required configuration: ${entry}"
            done
            exit 1
          fi

      # A `workflow_dispatch` run always receives every secret, whatever ref
      # it later checks out — unlike a `pull_request` run, which withholds
      # them from a fork head. This step restores that guarantee: it resolves
      # the pull request through the API and fails before any later job
      # checks out or executes its code. See docs/operations/preview-deployment.md.
      - name: Refuse a head outside this repository
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            // `head.repo` is null when the head repository has been deleted;
            // that is "origin cannot be confirmed", which fails closed here
            // rather than reading as trusted.
            const headRepo = pr.head.repo ? pr.head.repo.full_name : null;
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (headRepo !== thisRepo) {
              core.setFailed(
                `Pull request #${pr.number}'s head is ${headRepo ?? 'an unresolvable repository'}, not ${thisRepo}. ` +
                  `This workflow builds and signs the checked-out code with this repository's keystore and Firebase credentials, ` +
                  `so it refuses a head it cannot attribute to this repository. See docs/operations/preview-deployment.md.`,
              );
              return;
            }
            core.setOutput('head-sha', pr.head.sha);
            core.notice(`Building pull request #${pr.number} at head commit ${pr.head.sha}.`);
        env:
          PR_NUMBER: ${{ inputs.pull-request-number }}

      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.guard.outputs.head-sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Compute preview version name
        id: version
        run: |
          version=$(node -p "require('./app.json').expo.version")
          echo "version-name=${version}-pr-${{ inputs.pull-request-number }}" >> "$GITHUB_OUTPUT"

      - name: Write preflight summary
        run: |
          {
            echo "### Preflight"
            echo "- Commit: \`${{ steps.guard.outputs.head-sha }}\`"
            echo "- Preview version: \`${{ steps.version.outputs.version-name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  prebuild:
    name: Prebuild
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      sentry-release: ${{ steps.sentry-release.outputs.sentry-release }}
    env:
      PREVIEW_VERSION_NAME: ${{ needs.preflight.outputs.version-name }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head-sha }}

      # The ambient GITHUB_SHA a `workflow_dispatch` run gets from Actions
      # names the dispatched-from ref, not this checkout. `app.config.ts`
      # reads GITHUB_SHA to compose the Sentry release string below, so the
      # real head commit is exported explicitly ahead of that read.
      - name: Export checked-out commit SHA
        run: echo "GITHUB_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install -g "npm@$(node -p "require('./package.json').engines.npm")"

      - name: Dependency Installation
        run: npm ci

      # `resolveSentryRelease` in src/core/instrumentation/sentry-identity.ts
      # computes this once and `app.config.ts` exposes it at
      # `extra.sentryRelease`; reading it here (rather than recomposing
      # `${version}+${sha}`) keeps the release the app reports at runtime and
      # the release the `build` job's Sentry upload is filed under the same
      # value from the same source.
      - name: Resolve Sentry release
        id: sentry-release
        run: |
          release=$(npx expo config --type public --json | jq -r '.extra.sentryRelease')
          echo "sentry-release=${release}" >> "$GITHUB_OUTPUT"

      - name: Restore prebuild cache
        id: prebuild-cache
        uses: actions/cache@v4
        with:
          path: android
          key: prebuild-android-${{ hashFiles('app.json', 'app.config.ts', 'package-lock.json') }}-${{ env.PREVIEW_VERSION_NAME }}

      - name: Generate native Android project
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install

      # actions/upload-artifact normalises permissions on upload (dirs 755,
      # files 644), which would strip android/gradlew's executable bit; a tar
      # archive carries the bit through instead.
      - name: Archive native Android project
        run: tar -czf native-android.tar.gz android

      - name: Upload native Android project
        uses: actions/upload-artifact@v4
        with:
          name: native-project-android
          path: native-android.tar.gz
          retention-days: 1

  build:
    name: Build
    needs: [preflight, prebuild]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREVIEW_VERSION_NAME: ${{ needs.preflight.outputs.version-name }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head-sha }}

      # Same reasoning as the prebuild job's own export: this job's Gradle
      # build re-evaluates app.config.ts to bundle the JS `Constants`, and the
      # ambient GITHUB_SHA is wrong for that read too.
      - name: Export checked-out commit SHA
        run: echo "GITHUB_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install -g "npm@$(node -p "require('./package.json').engines.npm")"

      - name: Dependency Installation
        run: npm ci

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # The NDK C++ compile below once ran this runner out of disk entirely,
      # building all four Android ABIs; app.json's expo-build-properties
      # plugin now restricts the compile to arm64-v8a, and this step reclaims
      # space from several large preinstalled toolchains this build never
      # touches, on top of that fix. See docs/operations/preview-deployment.md.
      - name: Report free disk space (before reclaiming)
        run: df -h

      - name: Reclaim unused preinstalled toolchains
        run: |
          before_kb=$(df --output=avail -k / | tail -1)

          for path in /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            if [ -e "$path" ]; then
              sudo rm -rf "$path"
              echo "Removed $path"
            else
              echo "$path not present on this runner image — skipping"
            fi
          done

          if command -v docker >/dev/null 2>&1; then
            docker image prune --all --force || echo "docker image prune found nothing to remove"
          fi

          after_kb=$(df --output=avail -k / | tail -1)
          freed_kb=$((after_kb - before_kb))
          echo "Reclaimed roughly $((freed_kb / 1024)) MiB on / (before: $((before_kb / 1024)) MiB avail, after: $((after_kb / 1024)) MiB avail)"

      - name: Report free disk space (after reclaiming)
        run: df -h

      - name: Download native Android project
        uses: actions/download-artifact@v4
        with:
          name: native-project-android

      - name: Extract native Android project
        run: tar -xzf native-android.tar.gz

      # The prebuild cache above is keyed on inputs that do not change
      # between two dispatches of the same pull request, so a cache hit can
      # restore a versionCode an earlier run already baked in. Stamping it
      # here, unconditionally, makes this run's own GITHUB_RUN_NUMBER win
      # regardless of whether the cache hit.
      - name: Stamp build number
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle

          # Actions runs this script as `bash --noprofile --norc -eo
          # pipefail`: an assignment whose command substitution exits
          # non-zero aborts the step there and then, so a `grep` that
          # matches nothing (versionCode absent, or not in the expected
          # shape) would kill the job with a raw, unnamed error instead of
          # reaching the named `::error::` below — the exact case this check
          # exists to report. Same idiom as the provisioning-profile
          # read-back in ios-preview.yaml's "Install provisioning profile"
          # step.
          actual=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle || true)
          if [ "$actual" != "$GITHUB_RUN_NUMBER" ]; then
            echo "::error::Failed to stamp GITHUB_RUN_NUMBER (${GITHUB_RUN_NUMBER}) into android/app/build.gradle's versionCode — read back '${actual:-<none>}'."
            exit 1
          fi

      # The keystore is written under $RUNNER_TEMP, outside the working tree,
      # and only its path — never its bytes — reaches fastlane.
      - name: Write signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keystore_path="$RUNNER_TEMP/juicio-release.keystore"

          # A copy-pasted secret commonly picks up wrapped line breaks or a
          # trailing carriage return; base64 carries no information in
          # whitespace, so strip all of it before decoding rather than
          # rejecting an otherwise-correct value outright.
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore_path" 2>/dev/null || [ ! -s "$keystore_path" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (all whitespace was already stripped before decoding, so this is not a line-wrapping or CRLF artifact). Recreate it locally: base64 -w0 your-release.keystore > keystore.b64 (macOS: base64 -i your-release.keystore -o keystore.b64), then confirm it round-trips before pasting it in: base64 -w0 your-release.keystore | base64 --decode | cmp - your-release.keystore (no output means it matches). Paste the contents of keystore.b64 into the ANDROID_KEYSTORE_BASE64 secret. See docs/operations/secrets.md."
            exit 1
          fi

          # Verify the decoded bytes are actually a keystore, and that
          # ANDROID_KEYSTORE_PASSWORD unlocks it, before Gradle ever sees
          # either — otherwise a corrupt or mismatched secret fails deep
          # inside the signing step with a message about Gradle, never about
          # the secret. keytool's own output is never echoed verbatim: only a
          # fixed message below ever reaches the log either way.
          keytool_log="$RUNNER_TEMP/keytool-verify.log"
          if ! keytool -list -keystore "$keystore_path" -storepass "$ANDROID_KEYSTORE_PASSWORD" > "$keytool_log" 2>&1; then
            # Only keytool's own "keytool error: ..." line decides which
            # diagnosis to print — other lines a JVM can emit are never
            # treated as evidence, so unrelated output never misroutes it.
            if grep "^keytool error:" "$keytool_log" | grep -qi "password"; then
              echo "::error::ANDROID_KEYSTORE_PASSWORD does not unlock the keystore decoded from ANDROID_KEYSTORE_BASE64. Confirm the two secrets come from the same keystore (keytool -genkeypair or equivalent) and that the password has no leading or trailing whitespace. See docs/operations/secrets.md."
            else
              echo "::error::ANDROID_KEYSTORE_BASE64 decoded successfully but is not a valid Java keystore. Recreate it with keytool -genkeypair (or re-export the existing keystore file), then base64 -w0 your-release.keystore > keystore.b64 and paste keystore.b64's contents into the ANDROID_KEYSTORE_BASE64 secret. See docs/operations/secrets.md."
            fi
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      # Sentry source-map upload rides inside this same Gradle build: the
      # `@sentry/react-native/expo` config plugin wires the Sentry Android
      # Gradle Plugin into android/app/build.gradle at prebuild time, and its
      # own sentry-cli step reads these variables straight from the
      # environment — no separate upload step needed. When `preflight` found
      # the Sentry set incomplete, SENTRY_DISABLE_AUTO_UPLOAD turns the
      # upload off instead, so the build never depends on it.
      #
      # EXPO_PUBLIC_SENTRY_DSN sits here too because this is the step where
      # the bundler inlines EXPO_PUBLIC_ variables into the JS bundle, not
      # at prebuild or publish — see docs/operations/secrets.md for the rest.
      - name: Build signed release APK
        id: build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ needs.prebuild.outputs.sentry-release }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ needs.preflight.outputs.sentry-configured == 'false' && 'true' || 'false' }}
        run: bundle exec fastlane android build

      # `if: always()` so this still runs, and still names free space, when
      # the build step above fails from running out of disk mid-build.
      - name: Report free disk space (after build)
        if: always()
        run: df -h

      - name: Stage signed APK for hand-off
        run: |
          mkdir -p dist
          cp "${{ steps.build.outputs.apk-path }}" dist/juicio-preview.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: preview-binary-android
          path: dist/juicio-preview.apk
          retention-days: 1

  publish:
    name: Publish
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment the install link on this pull request
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head-sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: preview-binary-android
          path: dist

      # Same rule as the keystore above: the credentials file lives under
      # $RUNNER_TEMP, outside the working tree, and only its path reaches
      # fastlane. The secret holds the service-account JSON verbatim (not
      # base64-encoded), so no whitespace is stripped — that would corrupt
      # the JSON — and `printf '%s\n'` preserves its newlines intact, which a
      # bare `echo` of a multi-line value is not guaranteed to do.
      - name: Write Firebase service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          credentials_path="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_path"

          # jq's own parse-error text names only a line and column, never the
          # offending content, so it is safe to include verbatim.
          if ! jq_error=$(jq empty "$credentials_path" 2>&1); then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON (${jq_error}). Re-download the service-account key from the Firebase console (Project settings -> Service accounts) or Google Cloud console (IAM & Admin -> Service Accounts -> Keys) and paste its contents verbatim -- do not base64-encode it -- into the FIREBASE_SERVICE_ACCOUNT_JSON secret. See docs/operations/secrets.md."
            exit 1
          fi

          # Both substitutions end in `|| true`: `jq empty` above only proves
          # the file is valid JSON, not that its top level is an object — a
          # valid JSON array or scalar (e.g. `[1,2,3]` or `"x"`) passes that
          # check but makes `.[$f]` a jq type error ("Cannot index array with
          # string ..."), which exits non-zero. Under `bash -eo pipefail`
          # that would abort the step before the field-shape `::error::`
          # below ever runs — the exact case this check exists to report.
          missing_fields=()
          for field in type project_id private_key client_email; do
            value=$(jq -r --arg f "$field" '.[$f] // empty' "$credentials_path" 2>/dev/null || true)
            [ -n "$value" ] || missing_fields+=("$field")
          done
          account_type=$(jq -r '.type // empty' "$credentials_path" 2>/dev/null || true)

          if [ "${#missing_fields[@]}" -gt 0 ] || [ "$account_type" != "service_account" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON does not look like a service-account key (expected \"type\": \"service_account\" plus project_id, private_key, and client_email). Re-download it from the Firebase console (Project settings -> Service accounts) or Google Cloud console (IAM & Admin -> Service Accounts -> Keys) and paste its contents verbatim into the FIREBASE_SERVICE_ACCOUNT_JSON secret. See docs/operations/secrets.md."
            exit 1
          fi

          echo "FIREBASE_SERVICE_ACCOUNT_CREDENTIALS_PATH=$credentials_path" >> "$GITHUB_ENV"

      - name: Publish to Firebase App Distribution
        id: publish
        env:
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          PREVIEW_APK_PATH: dist/juicio-preview.apk
        run: bundle exec fastlane android publish

      # A fresh comment per deploy, never an edit to a previous one, gated on
      # the publish step's own output — so a run that did not actually
      # publish never comments a link at all.
      - name: Comment install link on pull request
        if: steps.publish.outputs.testing-uri != ''
        uses: actions/github-script@v7
        env:
          TESTING_URI: ${{ steps.publish.outputs.testing-uri }}
          VERSION_NAME: ${{ needs.preflight.outputs.version-name }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
        with:
          script: |
            const testingUri = process.env.TESTING_URI;
            const versionName = process.env.VERSION_NAME;
            const prNumber = Number(process.env.PR_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `<!-- agent -->\nAndroid preview build \`${versionName}\` is ready: ${testingUri}`,
            });
            core.notice(`Android preview build ${versionName} is ready: ${testingUri}`);
            await core.summary
              .addHeading('Android Preview Published')
              .addRaw(`Build \`${versionName}\` is ready: ${testingUri}`)
              .write();
