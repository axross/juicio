name: Merge Checks

# This project's own CI: one job per tool. This is the CI loop-engineering's
# tail polls after a push (see .claude/skills/loop-engineering/SKILL.md).
# Keep REVIEW.md's do-not-report list in sync with exactly what these jobs
# enforce.
#
# Each job runs exactly one check, so a failure names the tool that failed
# rather than a shared step swallowing which check actually broke. The docs
# and links jobs are carried over from template-checks.yaml (see that file's
# own history) rather than duplicated as a fresh design.
#
# `on:` deliberately carries no `paths:` filter, and no workflow added here
# later should either: GitHub's own troubleshooting documentation states that
# a workflow skipped by a `paths:` filter leaves its required status checks
# Pending indefinitely, blocking a merge that never runs it. A job skipped by
# a job-level `if:` instead reaches a real `skipped` conclusion — one of the
# three statuses that same page counts as successful — so the checks list has
# an entry to show rather than a status nothing ever resolves. The `changes`
# job below runs `dorny/paths-filter` once and emits one boolean output per
# filter; every other job declares `needs: changes` and an `if:` reading the
# matching output, so only the jobs whose inputs actually changed do any
# work. `changes` itself carries no `if:` and must fail loudly rather than
# resolve to an empty change set or fail quietly — either way every dependent
# job lands as `skipped`. That is not a wall of green, but it is a wall of
# grey, and grey is quiet: nothing here obliges anyone to read the list
# before merging. `committed-binaries` below carries `if: ${{ !cancelled() }}`
# for exactly that reason — see its own comment.
# Both failure modes are set out in full in
# docs/decisions/2026-08-28-scope-ci-jobs-by-job-level-if-not-workflow-paths-filters.md.
#
# `committed-binaries` is the one job that runs regardless of what changed —
# it is the `changes` guard's home, and nothing about a change set can
# excuse that guard from running. Its second step, the binary guard proper,
# is narrower: it runs on `pull_request` events only, and not on the
# `add-espada-engine-binaries-*` branches espada-engine-artifacts.yaml
# itself opens. See that step's own comment for the two legitimate binary
# landings that carve-out exists for and the cost it accepts.

on:
  pull_request:
  push:
    branches: [main] # the project's default branch

# Cancel superseded runs on PR refs only: on the default branch every push is a
# distinct merged commit whose checks must run to completion, or back-to-back
# merges leave earlier commits with cancelled (never-completed) verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter needs this to fetch a pull request's changed
      # files from the GitHub REST API instead of local git history.
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      test: ${{ steps.filter.outputs.test }}
      e2e-coverage: ${{ steps.filter.outputs.e2e-coverage }}
      docs: ${{ steps.filter.outputs.docs }}
      links: ${{ steps.filter.outputs.links }}
      nitrogen-drift: ${{ steps.filter.outputs.nitrogen-drift }}
      abi-parity: ${{ steps.filter.outputs.abi-parity }}
      workflows: ${{ steps.filter.outputs.workflows }}
      android-binary: ${{ steps.filter.outputs.android-binary }}
      ios-binary: ${{ steps.filter.outputs.ios-binary }}
    steps:
      # Needed only for the push-to-main case, where dorny/paths-filter
      # diffs against the previous commit using local git history; a
      # pull_request event instead uses the GitHub REST API and needs no
      # checkout at all.
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect Changed Files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            lint:
              - 'src/**'
              - 'modules/*/src/**'
              - 'e2e/**'
              - '*.ts'
              - '*.js'
              - 'eslint.config.js'
              - 'package.json'
              - 'package-lock.json'
            typecheck:
              - 'src/**'
              - 'modules/*/src/**'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
            test:
              - 'src/**'
              - 'modules/*/src/**'
              - 'jest.config.js'
              # The jest-expo preset transforms every source file through
              # babel-jest with this file as its config, so a change here
              # changes what the whole suite compiles to. Without it a pull
              # request touching only babel.config.js runs lint (via the
              # root '*.js' glob) and skips the suite the change can break.
              - 'babel.config.js'
              - 'package.json'
              - 'package-lock.json'
            e2e-coverage:
              - 'e2e/scenarios.md'
              - 'e2e/flows/**'
              # The checker itself, so a change to it runs it. `npm run
              # test:e2e:coverage` is this one script; without it a pull
              # request rewriting the checker — including into something
              # that passes vacuously — never runs it.
              - 'e2e/check-scenario-coverage.mjs'
            docs:
              - 'docs/**'
              # Same reason: this job runs the five living-project-documentation
              # validators, so a skill refresh that changes one has to run them.
              - '.claude/skills/living-project-documentation/scripts/**'
            links:
              - '.claude/**'
              - 'README.md'
              - 'AGENTS.md'
              - 'REVIEW.md'
            nitrogen-drift:
              - 'modules/espada-engine/src/specs/**'
              - 'modules/espada-engine/nitro.json'
              - 'modules/espada-engine/nitrogen/generated/**'
              - 'package-lock.json'
            abi-parity:
              - 'modules/espada-engine/lib/espada-engine/src/ffi.rs'
              - 'modules/espada-engine/android/src/main/jniLibs/**'
            workflows:
              - '.github/**'
            android-binary:
              - 'modules/espada-engine/android/src/main/jniLibs/**'
            ios-binary:
              - 'modules/espada-engine/ios/EspadaEngine.xcframework/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true
      - name: Unit Test Run
        run: npm run test:unit

  e2e-coverage:
    name: E2E Scenario Coverage
    needs: changes
    if: needs.changes.outputs.e2e-coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # This check imports only node: built-ins, so no npm ci (and thus no
      # npm cache) follows.
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: E2E Scenario Coverage
        run: npm run test:e2e:coverage

  docs:
    name: Docs Check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # These validators import only node: built-ins, so no npm ci (and thus
      # no npm cache) follows.
      - name: Setup Node
        uses: ./.github/actions/setup-node
      # The validators are deliberately separate commands — each answers for
      # one kind of change, so an author who touched one document reads only
      # its findings. There is no run-all script by design; looping is the
      # documented form.
      - name: Check docs/
        run: |
          failed=0
          for check in .claude/skills/living-project-documentation/scripts/check-*.mjs; do
            echo "::group::$(basename "$check")"
            node "$check" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  links:
    name: Relative Link Check
    needs: changes
    if: needs.changes.outputs.links == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # This validator imports only node: built-ins, so no npm ci (and thus
      # no npm cache) follows.
      - name: Setup Node
        uses: ./.github/actions/setup-node
      # Narrowed to this job's own filter paths: relative links inside
      # docs/** remain covered by the docs job's check-references.mjs, which
      # also resolves link targets outside docs/.
      - name: Check Relative Links
        run: node .claude/skills/agent-skill-authoring/scripts/check-links.mjs .claude README.md AGENTS.md REVIEW.md

  nitrogen-drift:
    name: Nitrogen Drift Check
    needs: changes
    if: needs.changes.outputs.nitrogen-drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true
      # Regenerates modules/espada-engine's Nitrogen output from its
      # .nitro.ts spec and fails if that leaves its generated output
      # directory dirty — nothing else in this workflow ever runs the
      # generator, so a spec change committed without regenerating (or a
      # hand-edit to generated output) would otherwise drift silently until
      # someone happened to run it locally. `git add -A`, scoped to the
      # generator's own output directory, is what also catches a wholly new
      # generated file, not only a changed one — `git diff` alone never sees
      # an untracked path.
      - name: Nitrogen Drift Check
        run: |
          npm run nitrogen:espada-engine
          git add -A -- modules/espada-engine/nitrogen/generated
          if ! git diff --cached --exit-code -- modules/espada-engine/nitrogen/generated; then
            echo "::error::modules/espada-engine/nitrogen/generated is out of date with its .nitro.ts spec. Run 'npm run nitrogen:espada-engine' locally and commit the result."
            exit 1
          fi

  abi-parity:
    name: ABI Parity
    needs: changes
    if: needs.changes.outputs.abi-parity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Compares, as sorted sets, the `#[no_mangle] pub extern "C" fn` /
      # `pub unsafe extern "C" fn` names declared in ffi.rs against the
      # defined (non-UND) GLOBAL dynamic symbols readelf finds in the
      # committed Android .so — the two sides of this project's own C ABI,
      # which must always describe the same functions. Needs no Rust
      # toolchain, no NDK, and no Cargo compile at all — only `grep` and
      # `readelf` (binutils), both already on ubuntu-latest. This check
      # exists because that binary once silently went stale: the committed
      # .so kept exporting the old `juicio_native_*` symbols after the C ABI
      # was renamed to `espada_engine_*`, and nothing in CI noticed.
      - name: Verify Committed .so Matches ffi.rs's C ABI
        run: |
          set -euo pipefail
          ffi_rs="modules/espada-engine/lib/espada-engine/src/ffi.rs"
          so_path="modules/espada-engine/android/src/main/jniLibs/arm64-v8a/libespada_engine.so"

          expected=$(grep -oE '^pub (unsafe )?extern "C" fn [A-Za-z0-9_]+' "$ffi_rs" | awk '{print $NF}' | sort -u)
          actual=$(readelf -sW "$so_path" | awk '$4 == "FUNC" && $5 == "GLOBAL" && $7 != "UND" { print $NF }' | sort -u)

          if [ "$expected" != "$actual" ]; then
            echo "::error::Committed $so_path does not export exactly the C ABI declared in $ffi_rs. Regenerate it by dispatching the Espada Engine Artifacts workflow (.github/workflows/espada-engine-artifacts.yaml), which opens a pull request with the rebuilt binary."
            echo "Expected (from ffi.rs):"
            echo "$expected" | sed 's/^/  /'
            echo "Found (in the committed .so):"
            echo "$actual" | sed 's/^/  /'
            exit 1
          fi

          echo "Committed .so's exported C ABI symbols match ffi.rs exactly:"
          echo "$expected" | sed 's/^/  /'

  workflows:
    name: Workflow YAML Parse Check
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true
      # Parses every file under .github/workflows/ and .github/actions/ with
      # js-yaml, which package.json declares as a devDependency because this
      # check genuinely depends on it. It was previously reached only as a
      # transitive dependency of eslint and expo, which resolved whichever
      # major happened to hoist to the root and would have broken silently
      # the moment either stopped pulling it. It only proves each file is
      # syntactically valid YAML: it does not validate GitHub Actions' own
      # schema (an unknown key, a bad `uses:` ref, a malformed `if:`
      # expression) and it never runs a workflow. The existsSync filter stays
      # regardless, so this script keeps working if either directory is ever
      # removed.
      - name: Parse Workflow YAML
        run: |
          node <<'SCRIPT'
          const { readdirSync, readFileSync, existsSync } = require('node:fs');
          const { join } = require('node:path');
          const { load } = require('js-yaml');

          const dirs = ['.github/workflows', '.github/actions'].filter(existsSync);
          let failed = false;

          function collectYamlFiles(dir) {
            const out = [];
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const full = join(dir, entry.name);
              if (entry.isDirectory()) {
                out.push(...collectYamlFiles(full));
              } else if (/\.ya?ml$/.test(entry.name)) {
                out.push(full);
              }
            }
            return out;
          }

          for (const dir of dirs) {
            for (const file of collectYamlFiles(dir)) {
              try {
                load(readFileSync(file, 'utf8'));
                console.log('OK   ' + file);
              } catch (error) {
                console.log('FAIL ' + file);
                console.log(String(error));
                failed = true;
              }
            }
          }

          if (failed) {
            console.log('::error::One or more files under .github/workflows/ or .github/actions/ failed to parse as YAML.');
            process.exit(1);
          }
          SCRIPT

  committed-binaries:
    name: Guard Committed Binaries
    needs: changes
    # `!cancelled()` is what keeps this job running even when `changes`
    # itself fails, not only when it succeeds with an empty change set: a
    # bare `needs: changes` skips this job on that failure via the ordinary
    # needs cascade, and a job skipped that way lands as `skipped` — a
    # conclusion GitHub counts as successful, and one more grey entry in a
    # list nobody is required to read. The first step below turns a `changes`
    # failure into a real, red `failure` conclusion instead of reaching the
    # binary-guard logic with untrustworthy inputs.
    #
    # Not `always()`, which GitHub's expressions reference explicitly steers
    # away from: it returns true even when the run is cancelled, so with
    # `cancel-in-progress` on pull request refs a superseded run keeps this
    # job going, its first step reads `needs.changes.result` as `cancelled`,
    # and a routine supersede lands as a red `failure` instead of a
    # cancellation. `!cancelled()` still overrides the needs cascade on a
    # `changes` failure, which is the only case this override exists for.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Change Detection Succeeded
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::The changes job did not succeed (result: '${{ needs.changes.result }}'), so no merge check ran against this change and its outputs cannot be trusted. Failing this job on purpose so the run carries an explained red conclusion instead of a set of skipped checks that report nothing about this change."
            exit 1
          fi

      # modules/espada-engine's committed Android .so and iOS .xcframework
      # are produced only by dispatching espada-engine-artifacts.yaml, so on
      # an ordinary pull request either path changing means a binary this
      # project's own pipeline did not produce. Reads only the changes job's
      # outputs and builds nothing, so it costs seconds.
      #
      # Two legitimate landings would otherwise trip it, which is what the
      # condition below excludes. A push to main merging an
      # add-espada-engine-binaries-* pull request carries those paths in its
      # own diff, and flagging it would tell the maintainer to redo what they
      # just merged. And espada-engine-artifacts.yaml opens its pull request
      # with the default GITHUB_TOKEN, which triggers no workflow, so its own
      # body — and docs/operations/native-module-artifacts.md — tell the
      # maintainer to push an empty commit or open a follow-up pull request
      # to get checks running on it; following that advice puts the binary
      # paths in a pull request diff by design.
      #
      # The cost: a hand-edited binary that reaches main is not re-flagged by
      # the push run. It was already flagged on the pull request that
      # introduced it, which is where someone can still act on it.
      - name: Verify No Manual Binary Edits
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'add-espada-engine-binaries-') }}
        run: |
          failed=0
          if [ "${{ needs.changes.outputs.android-binary }}" = "true" ]; then
            echo "::error::modules/espada-engine/android/src/main/jniLibs/** changed outside espada-engine-artifacts.yaml. Regenerate this binary by dispatching that workflow (.github/workflows/espada-engine-artifacts.yaml) instead of editing it directly."
            failed=1
          fi
          if [ "${{ needs.changes.outputs.ios-binary }}" = "true" ]; then
            echo "::error::modules/espada-engine/ios/EspadaEngine.xcframework/** changed outside espada-engine-artifacts.yaml. Regenerate this binary by dispatching that workflow (.github/workflows/espada-engine-artifacts.yaml) instead of editing it directly."
            failed=1
          fi
          exit "$failed"
