name: Merge Checks

# This project's own CI: one job per tool. This is the CI loop-engineering's
# tail polls after a push (see .claude/skills/loop-engineering/SKILL.md).
# Keep REVIEW.md's do-not-report list in sync with exactly what these jobs
# enforce.
#
# Each job runs exactly one check, so a failure names the tool that failed
# rather than a shared step swallowing which check actually broke. The docs
# and links jobs are carried over from template-checks.yaml (see that file's
# own history) rather than duplicated as a fresh design.
#
# `on:` deliberately carries no `paths:` filter, and no workflow added here
# later should either: GitHub's own troubleshooting documentation states that
# a workflow skipped by a `paths:` filter leaves its required status checks
# Pending indefinitely, blocking a merge that never runs it. A job skipped by
# a job-level `if:` instead reaches a real `skipped` conclusion — one of the
# three statuses that same page counts as successful — so the checks list has
# an entry to show rather than a status nothing ever resolves. The `changes`
# job below runs `dorny/paths-filter` once and emits one boolean output per
# filter; every other job declares `needs: changes` and an `if:` reading the
# matching output, so only the jobs whose inputs actually changed do any
# work. `changes` itself carries no `if:` and must fail loudly rather than
# resolve to an empty change set or fail quietly. Either way every dependent
# job lands as `skipped`, and a failed `changes` is itself a red job, so the
# run is red regardless — nothing is guarding that case, and that is
# accepted. Both failure modes are set out in full in
# docs/decisions/2026-08-28-scope-ci-jobs-by-job-level-if-not-workflow-paths-filters.md.
# Every job here is gated that way; none carries a condition of its own.
#
# Nothing in this workflow looks at modules/espada-engine/'s committed
# artifacts. It does not regenerate the Nitro bindings and compare them
# against the spec, it does not compare the committed Android .so's exported
# symbols against ffi.rs, and it does not flag a hand-edited binary. Those
# three checks were removed and nothing replaced them; README.md's Testing
# section states what each one used to cover.

on:
  pull_request:
  push:
    branches: [main] # the project's default branch

# Cancel superseded runs on PR refs only: on the default branch every push is a
# distinct merged commit whose checks must run to completion, or back-to-back
# merges leave earlier commits with cancelled (never-completed) verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter needs this to fetch a pull request's changed
      # files from the GitHub REST API instead of local git history.
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      test: ${{ steps.filter.outputs.test }}
      e2e-coverage: ${{ steps.filter.outputs.e2e-coverage }}
      docs: ${{ steps.filter.outputs.docs }}
      links: ${{ steps.filter.outputs.links }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      # Needed only for the push-to-main case, where dorny/paths-filter
      # diffs against the previous commit using local git history; a
      # pull_request event instead uses the GitHub REST API and needs no
      # checkout at all.
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect Changed Files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            lint:
              - 'src/**'
              - 'modules/*/src/**'
              - 'e2e/**'
              - '*.ts'
              - '*.js'
              - 'eslint.config.js'
              # eslint-config-expo/flat sets `import/resolver: { typescript:
              # true }`, so import/no-unresolved resolves every `@/…`
              # specifier through this file's compilerOptions.paths. Nothing
              # here sets parserOptions.project, so that is the whole of the
              # dependency — and without this file every such import is
              # reported unresolved.
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
            typecheck:
              - 'src/**'
              - 'modules/*/src/**'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
            test:
              - 'src/**'
              - 'modules/*/src/**'
              - 'jest.config.js'
              # The jest-expo preset transforms every source file through
              # babel-jest with this file as its config, so a change here
              # changes what the whole suite compiles to. Without it a pull
              # request touching only babel.config.js runs lint (via the
              # root '*.js' glob) and skips the suite the change can break.
              - 'babel.config.js'
              # jest-expo's preset ends in withTypescriptMapping(), which
              # reads this file and builds moduleNameMapper from its
              # compilerOptions.paths. jest.config.js declares no mapper of
              # its own, so this file is the only thing that resolves `@/…`
              # for the suite; removing it drops all three aliases.
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
            e2e-coverage:
              - 'e2e/scenarios.md'
              - 'e2e/flows/**'
              # The checker itself, so a change to it runs it. `npm run
              # test:e2e:coverage` is this one script; without it a pull
              # request rewriting the checker — including into something
              # that passes vacuously — never runs it.
              - 'e2e/check-scenario-coverage.mjs'
              # And package.json, which is where `npm run test:e2e:coverage`
              # is defined. The script imports only node: built-ins, so this
              # is not a dependency entry — it is the same reason as the line
              # above: a pull request that rewrites what this job runs has to
              # run it.
              - 'package.json'
            docs:
              - 'docs/**'
              # Same reason: this job runs the five living-project-documentation
              # validators, so a skill refresh that changes one has to run them.
              - '.claude/skills/living-project-documentation/scripts/**'
            links:
              - '.claude/**'
              - 'README.md'
              - 'AGENTS.md'
              - 'REVIEW.md'
            rust:
              # Both Rust crates under modules/espada-engine/lib/, each with
              # its own manifest and lockfile now that the Cargo workspace
              # over them is dissolved (see
              # docs/decisions/2026-08-28-fork-espada-and-give-each-library-its-own-directory.md).
              # espada-internal is a fork maintained in this repository, not a
              # verbatim vendored copy, so its own format, lint and test gates
              # run in this job too — a pull request touching only it must
              # trigger rust-checks the same as one touching only
              # espada-engine. lib/bridge/ is deliberately absent: it is C++,
              # and no Rust check reads it.
              - 'modules/espada-engine/lib/espada-engine/**'
              - 'modules/espada-engine/lib/espada-internal/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          install: true
      - name: Unit Test Run
        run: npm run test:unit

  e2e-coverage:
    name: E2E Scenario Coverage
    needs: changes
    if: needs.changes.outputs.e2e-coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # This check imports only node: built-ins, so no npm ci (and thus no
      # npm cache) follows.
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: E2E Scenario Coverage
        run: npm run test:e2e:coverage

  docs:
    name: Docs Check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # These validators import only node: built-ins, so no npm ci (and thus
      # no npm cache) follows.
      - name: Setup Node
        uses: ./.github/actions/setup-node
      # The validators are deliberately separate commands — each answers for
      # one kind of change, so an author who touched one document reads only
      # its findings. There is no run-all script by design; looping is the
      # documented form.
      - name: Check docs/
        run: |
          failed=0
          for check in .claude/skills/living-project-documentation/scripts/check-*.mjs; do
            echo "::group::$(basename "$check")"
            node "$check" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  links:
    name: Relative Link Check
    needs: changes
    if: needs.changes.outputs.links == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # This validator imports only node: built-ins, so no npm ci (and thus
      # no npm cache) follows.
      - name: Setup Node
        uses: ./.github/actions/setup-node
      # Narrowed to this job's own filter paths: relative links inside
      # docs/** are covered by the docs job's check-references.mjs, which
      # also resolves link targets outside docs/ — but only when the docs
      # filter matches. The residual-risk note in the decision record this
      # file's header cites names that gap.
      - name: Check Relative Links
        run: node .claude/skills/agent-skill-authoring/scripts/check-links.mjs .claude README.md AGENTS.md REVIEW.md

  rust-checks:
    name: Rust Checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Roughly double the slowest measured run of this job in its former home,
    # espada-engine-artifacts.yaml: 38-78 seconds of job wall clock on main,
    # 38-44 s with a warm Cargo cache and 78 s cold. Its former
    # timeout-minutes of 20 was doubled from an estimate rather than a
    # measurement, and was an order of magnitude out.
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
          cache-key-prefix: cargo-rust-checks
      # This is the merge check that runs both Rust crates' own checks:
      # before this job existed, none of the three ran in CI at all (see
      # README.md's Testing checks table and
      # docs/conventions/testing.md), so a regression in this module's Rust
      # was caught by nobody until someone happened to run these by hand. All
      # three run on the host — no Android toolchain, no macOS runner, no
      # repository secret.
      #
      # `lib/` no longer holds one Cargo workspace over both crates (see
      # docs/decisions/2026-08-28-fork-espada-and-give-each-library-its-own-directory.md):
      # espada-engine and espada-internal each carry their own manifest and
      # lockfile now, so there is no single `--workspace` or `-p` flag left to
      # scope against — each command below names its own crate's
      # `--manifest-path` instead, six invocations rather than three.
      #
      # Format and lint used to be scoped away from espada-internal, because
      # it was a verbatim copy of axross/espada and the only way to satisfy a
      # gate the copy failed was to edit the copy — which would have made it
      # no longer diffable against upstream. That reason is gone:
      # espada-internal is a fork maintained in this repository now, so it is
      # held to the same format and lint gates as espada-engine, the same way
      # any other crate here is.
      - name: espada-engine — Rust Format Check
        run: cargo fmt --check --manifest-path modules/espada-engine/lib/espada-engine/Cargo.toml
      - name: espada-engine — Rust Lint
        run: cargo clippy --all-targets --manifest-path modules/espada-engine/lib/espada-engine/Cargo.toml -- -D warnings
      - name: espada-engine — Rust Unit Tests
        run: cargo test --manifest-path modules/espada-engine/lib/espada-engine/Cargo.toml
      - name: espada-internal — Rust Format Check
        run: cargo fmt --check --manifest-path modules/espada-engine/lib/espada-internal/Cargo.toml
      - name: espada-internal — Rust Lint
        run: cargo clippy --all-targets --manifest-path modules/espada-engine/lib/espada-internal/Cargo.toml -- -D warnings
      - name: espada-internal — Rust Unit Tests
        run: cargo test --manifest-path modules/espada-engine/lib/espada-internal/Cargo.toml
