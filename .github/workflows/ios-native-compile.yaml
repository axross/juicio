name: iOS Native Compile

# Compiles the iOS app for the Simulator, with code signing disabled, so
# modules/espada-engine/'s iOS half is finally proven to build. Nothing in
# this repository has ever compiled it — see
# docs/operations/native-module-artifacts.md's "The Android Binary Exists;
# the iOS One Does Not" for why. This workflow exists to prove exactly four
# things that have never been observed to work:
#
#   - the podspec (modules/espada-engine/EspadaEngine.podspec) resolves under
#     CocoaPods — in particular, that removing its old generated-cpp/ copy
#     step was correct now that the podspec sits at the module root with
#     cpp/ as a sibling directory, so `s.source_files = "cpp/*.{h,hpp,cpp}"`
#     resolves without CocoaPods' own path restriction ever tripping (see
#     that podspec's own comment for the layout this replaced);
#   - Nitrogen's generated C++
#     (modules/espada-engine/nitrogen/generated/shared/c++/) and the
#     hand-written modules/espada-engine/cpp/EspadaEngineHybridObject.cpp
#     compile under Xcode's own toolchain;
#   - Nitrogen's generated Objective-C `+ (void) load` registration
#     (modules/espada-engine/nitrogen/generated/ios/EspadaEngineAutolinking.mm)
#     links into the app binary;
#   - modules/espada-engine/ios/EspadaEngine.xcframework is found by
#     CocoaPods' `s.vendored_frameworks` and linked into the app.
#
# It replaces a manual step the maintainer would otherwise run on their own
# Mac. A Simulator build needs neither a signing identity nor a provisioning
# profile, so this workflow reads no repository secret at all — unlike
# android-preview.yaml and ios-preview.yaml, which distribute a *signed*
# build and therefore need the Apple and Firebase secrets
# docs/operations/secrets.md inventories.
#
# WORKFLOW_DISPATCH ONLY, NEVER ON pull_request OR push: a macOS runner bills
# at roughly 10x a Linux one ($0.062/minute against $0.006/minute — see
# docs/operations/preview-deployment.md), and this project's standing policy
# is that nothing spending macOS-runner minutes runs except when a human
# explicitly dispatches it. This is not a merge-checks.yaml job for the same
# reason merge-checks.yaml's own native_android_compile job has no iOS
# counterpart today: ubuntu-latest cannot compile for iOS at all.
#
# ONE JOB, four stages, each its own named step so a failure names the stage
# that broke — prebuild, pod install, or compile — rather than an
# undifferentiated log: `Generate native iOS project`, `Install CocoaPods
# dependencies`, `Resolve workspace and scheme`, and `Compile app for the iOS
# Simulator`. No fastlane lane is used here (unlike ios-preview.yaml's build
# lane): fastlane's own ios build lane exists to produce a *signed* archive,
# which this workflow deliberately does not attempt, so this job calls
# `pod install` and `xcodebuild` directly.
#
# THIS HAS NEVER RUN. The iOS build has never succeeded in this repository,
# so expect this workflow to need iteration once it is first dispatched —
# see docs/operations/native-module-artifacts.md for what is observed versus
# merely described about the iOS half.

on:
  workflow_dispatch:

concurrency:
  group: ios-native-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned rather than left at the runner image's default, which GitHub
      # rotates on its own schedule — same reasoning ios-preview.yaml's own
      # "Select Xcode version" step states and verifies (macos-latest
      # resolved to macOS 26 with Xcode 26.6 selected by default, checked
      # against actions/runner-images' macOS 26 Arm64 image on 2026-08-26).
      # `xcodebuild -version` confirms in the log which toolchain the rest of
      # this job actually used. If a later image drops this version,
      # re-verify what the image ships and update the pinned path — never
      # fall back to the default.
      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install -g "npm@$(node -p "require('./package.json').engines.npm")"

      - name: Dependency Installation
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      # macos-latest ships CocoaPods preinstalled — the same assumption
      # ios-preview.yaml's own "Install CocoaPods dependencies" step makes,
      # with no explicit CocoaPods install step of its own. This is also the
      # step that proves EspadaEngine.podspec resolves at all: it fails
      # loudly (CocoaPods' own diagnostic, not swallowed) if `source_files`,
      # `vendored_frameworks`, or the `add_nitrogen_files` load fail to
      # resolve.
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      # Derived by glob, never hardcoded — the same lookup
      # fastlane/Fastfile's `resolved_ios_project_paths` (lines 53-63) uses
      # for the exact reason its own comment gives: a hardcoded project name
      # silently stops matching the moment app.json's name changes, and nothing
      # would say why. This job does not call into fastlane at all (see this
      # file's header comment), so the same glob-then-fail-loud shape is
      # reimplemented directly here rather than shared code, mirroring how
      # merge-checks.yaml's native_android_compile job also bypasses fastlane
      # for its own raw Gradle invocation.
      - name: Resolve workspace and scheme
        id: resolve
        run: |
          set -euo pipefail
          workspace_path=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          if [ -z "$workspace_path" ]; then
            echo "::error::No .xcworkspace found under ios/ after pod install. Expected CocoaPods to generate one alongside the Podfile — see fastlane/Fastfile's resolved_ios_project_paths for the same lookup ios-preview.yaml's build lane depends on."
            exit 1
          fi
          scheme=$(basename "$workspace_path" .xcworkspace)
          echo "Resolved workspace $workspace_path, scheme $scheme"
          echo "workspace-path=$workspace_path" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      # -sdk iphonesimulator plus -destination 'generic/platform=iOS
      # Simulator' builds for the Simulator without needing one booted or
      # even present on the runner — the same generic-destination mechanism
      # Apple's own xcodebuild documentation states for building against a
      # platform generically instead of a specific device. CODE_SIGNING_ALLOWED=NO
      # is the flag this repository's own iOS pipeline never needs (its
      # signed builds import a real certificate and profile instead — see
      # ios-preview.yaml) but this one does: a Simulator build has no
      # signing identity or provisioning profile available at all, and this
      # setting is what stops Xcode's generated project — which defaults to
      # "Automatically manage signing" — from trying to resolve either one.
      # -configuration Debug matches every other unsigned/local iOS build in
      # this project (`npm run ios`) and, unlike Release, does not invoke the
      # React Native bundling build phase, which needs a running Metro server
      # this job never starts.
      - name: Compile app for the iOS Simulator
        run: |
          set -euo pipefail
          # ARCHS=arm64 is not an optimisation — without it this build asks
          # for something this project deliberately does not ship. A generic
          # simulator destination makes Xcode link every valid simulator
          # architecture, x86_64 included, and EspadaEngine.xcframework
          # carries only `ios-arm64` and `ios-arm64-simulator`, because
          # supporting the Intel-Mac simulator is an explicit non-goal (see
          # the plan behind this module, issue #7). The first run of this
          # workflow failed exactly there, and the message is worth
          # recognising: `ld: library 'espada_engine' not found` for the
          # x86_64 slice — a library-not-found error, not undefined symbols.
          # The linker never opened the archive; there was no x86_64 slice to
          # open.
          #
          # If the Intel simulator ever comes into scope, the fix is a third
          # slice in the xcframework, not a change here.
          xcodebuild build \
            -workspace "${{ steps.resolve.outputs.workspace-path }}" \
            -scheme "${{ steps.resolve.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
