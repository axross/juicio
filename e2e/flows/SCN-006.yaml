appId: app.axross.juicio
---
- launchApp
- tapOn:
    id: 'tab-bar-item-settings'
- tapOn:
    id: 'settings-theme-light'
- assertVisible:
    id: 'settings-theme-light'
    checked: true

# Force-quit and relaunch without clearing state, so the persisted theme
# survives the restart.
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: 'tab-bar-item-settings'
- assertVisible:
    id: 'settings-theme-light'
    checked: true

# Leave the theme as System for every scenario that runs after this one.
- tapOn:
    id: 'settings-theme-system'
