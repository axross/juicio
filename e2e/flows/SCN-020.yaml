appId: app.axross.juicio
---
- launchApp:
    clearState: true
- tapOn:
    id: 'tab-bar-item-presets'
- assertVisible:
    id: 'presets-empty-state'

# creates the two presets this flow goes on to filter between, through the
# real editor issue #177 built — this fixture used to be assumed (a
# pre-seeded "BTN Open"/"CO Open" pair nothing in this project actually
# seeded), since no interaction path in the app could create a saved
# preset yet; it's built here the same way SCN-022 builds its own.
- tapOn:
    id: 'presets-new-preset-fab'
- tapOn:
    id: 'preset-editor-name-input'
- inputText: 'BTN Open'
- tapOn:
    id: 'chip-55+'
- tapOn:
    id: 'tag-position-BTN'
- tapOn:
    id: 'preset-editor-submit-bar'
- assertVisible:
    text: 'BTN Open'

- tapOn:
    id: 'presets-new-preset-fab'
- tapOn:
    id: 'preset-editor-name-input'
- inputText: 'CO Open'
- tapOn:
    id: 'chip-55+'
- tapOn:
    id: 'tag-position-CO'
- tapOn:
    id: 'preset-editor-submit-bar'
- assertVisible:
    text: 'CO Open'

- assertVisible:
    id: 'presets-filter-chips'
- assertVisible:
    text: 'BTN Open'
- assertVisible:
    text: 'CO Open'

- tapOn:
    id: 'chip-position'
- assertVisible:
    id: 'heading'
    text: 'Position'
- tapOn:
    id: 'value-BTN'
- tapOn:
    id: 'handle'

- assertVisible:
    text: 'BTN Open'
- assertNotVisible:
    text: 'CO Open'
- assertVisible:
    id: 'pill-position-BTN'

- tapOn:
    id: 'pill-position-BTN'
- assertVisible:
    text: 'BTN Open'
- assertVisible:
    text: 'CO Open'
- assertNotVisible:
    id: 'presets-filter-pills'
