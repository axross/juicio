appId: app.axross.juicio
---
- launchApp
- assertVisible:
    id: 'analyze-add-player-fab'

- tapOn:
    id: 'analyze-add-player-fab'
- tapOn:
    id: 'tab-handRange'
- tapOn:
    id: 'chip-55+'
- tapOn:
    id: 'handle'

- assertVisible:
    id: 'player-row-player-1'
    text: 'Player 1'

# a second player is required here, not merely convenient — see
# SCN-017.yaml's own comment above for why: issue #103's own gating only
# wires `onDetailPress` up once a settled equity result exists for that
# player, and a result can never exist for a lone player (evaluation
# requires 2-3 players).
- tapOn:
    id: 'analyze-add-player-fab'
- tapOn:
    id: 'tab-handRange'
- tapOn:
    id: 'chip-A2s+'
- tapOn:
    id: 'handle'

- assertVisible:
    id: 'player-row-player-2'
    text: 'Player 2'

# NOT YET VERIFIABLE FROM CI OR THIS SESSION: past this point, this
# scenario's own pass/fail status needs on-device confirmation once
# modules/espada-engine's native binaries exist (docs/operations/
# native-module-artifacts.md), the same standing caveat SCN-017.yaml's own
# comment above its `detail` tap records, including the same pending-result
# race this flow family has no wait/assertion idiom for yet.
- tapOn:
    id: 'detail'
    childOf:
      id: 'player-row-player-1'

- assertVisible:
    id: 'analyze-equity-breakdown-sheet'

# the four strength-band legend items (added by #255) each carry a `label`
# and a `count` child testID. The count is driven by the live equity
# computation and cannot be asserted exactly here (see e2e/scenarios.md's
# own SCN-024 entry for why), so this only asserts that each item is
# visible and that its count reads as a non-negative integer followed by
# the fixed, untranslated `combos` unit string (`handRanges:cardPairCount`
# in src/core/i18n/resources/en.ts — always plural, no singular form exists
# in either locale).
- assertVisible:
    id: 'legend-trash'
- assertVisible:
    id: 'count'
    childOf:
      id: 'legend-trash'
    text: '^\d+ combos$'
- assertVisible:
    id: 'legend-marginal'
- assertVisible:
    id: 'count'
    childOf:
      id: 'legend-marginal'
    text: '^\d+ combos$'
- assertVisible:
    id: 'legend-value'
- assertVisible:
    id: 'count'
    childOf:
      id: 'legend-value'
    text: '^\d+ combos$'
- assertVisible:
    id: 'legend-nuts'
- assertVisible:
    id: 'count'
    childOf:
      id: 'legend-nuts'
    text: '^\d+ combos$'
