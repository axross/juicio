appId: app.axross.juicio
---
- launchApp
- tapOn:
    id: 'tab-bar-item-settings'
- assertVisible:
    id: 'settings-theme-section'

- tapOn:
    id: 'settings-theme-light'
- assertVisible:
    id: 'settings-theme-light'
    checked: true

- tapOn:
    id: 'settings-theme-system'
- assertVisible:
    id: 'settings-theme-system'
    checked: true

- tapOn:
    id: 'settings-theme-dark'
- assertVisible:
    id: 'settings-theme-dark'
    checked: true

- tapOn:
    id: 'settings-theme-system'
- assertVisible:
    id: 'settings-theme-system'
    checked: true
