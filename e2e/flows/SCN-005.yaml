appId: app.axross.juicio
---
- launchApp
- tapOn:
    id: 'tab-bar-item-settings'
- tapOn:
    id: 'settings-language-row'
- tapOn:
    id: 'settings-language-ja'
- assertVisible:
    id: 'title'
    childOf:
      id: 'settings-language-nav-bar'
    text: '言語'

# force-quit and relaunch without clearing state, so the persisted language
# override survives the restart — this is the assertion, not `launchApp`'s
# own behaviour. the app always lands on Analyze, so a relaunch is checked
# there, immediately, for no visible flash of English on the very first
# frame.
- stopApp
- launchApp:
    clearState: false
- assertVisible:
    id: 'title'
    childOf:
      id: 'analyze-nav-bar'
    text: '解析'
- assertVisible:
    id: 'tab-bar-item-history'
    text: '履歴'

- tapOn:
    id: 'tab-bar-item-settings'
- tapOn:
    id: 'settings-language-row'
- assertVisible:
    id: 'settings-language-ja'
    checked: true

# leave the language as English for every scenario that runs after this one.
- tapOn:
    id: 'settings-language-en'
