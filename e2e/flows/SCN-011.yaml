appId: app.axross.juicio
---
- launchApp
- tapOn:
    id: 'tab-bar-item-settings'
- tapOn:
    id: 'settings-about-feedback'
- assertVisible:
    id: 'feedback-nav-bar-title'
    text: 'Feedback'

- assertVisible:
    id: 'feedback-submit-bar'
    enabled: true

- tapOn:
    id: 'feedback-submit-bar'
- assertVisible:
    id: 'feedback-message-input-error'
    text: 'A message is required.'

- tapOn:
    id: 'feedback-message-input'
- inputText: 'Great app, one bug though.'

# typing alone clears the message-required error — see the
# high-fidelity-ui-design skill's interaction-states-and-feedback.md rule to
# re-validate live only after a field has already shown an error, so the
# user watches it clear — so this asserts right after the input, before any
# second press.
- assertNotVisible:
    id: 'feedback-message-input-error'

# dismisses the keyboard by tapping a non-input element inside the scroll
# view — its own default `keyboardShouldPersistTaps` behaviour, per
# `feedback-form.tsx`'s header comment — so the submit bar reappears.
- tapOn:
    id: 'feedback-intro'

- tapOn:
    id: 'feedback-submit-bar'

- assertVisible:
    id: 'feedback-error-banner'
    text: "Feedback can't be sent from this build. Try again from an installed release build."

- tapOn:
    id: 'feedback-nav-bar-back'
- assertVisible:
    id: 'settings-nav-bar-title'
    text: 'Settings'
