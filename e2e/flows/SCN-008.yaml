appId: app.axross.juicio
---
- launchApp
- tapOn:
    id: 'tab-bar-item-presets'
- assertVisible:
    id: 'presets-native-demo'
- assertNotVisible:
    id: 'presets-native-demo-cancel-button'

- tapOn:
    id: 'presets-native-demo-start-button'
- assertVisible:
    id: 'presets-native-demo-cancel-button'
- assertVisible:
    id: 'presets-native-demo-progress'

- assertVisible:
    id: 'presets-native-demo-result'
    timeout: 15000
