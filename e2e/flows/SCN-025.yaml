appId: app.axross.juicio
---
- launchApp
- assertVisible:
    id: 'analyze-add-player-fab'

- tapOn:
    id: 'analyze-add-player-fab'
- tapOn:
    id: 'tab-handRange'
- tapOn:
    id: 'chip-55+'
- tapOn:
    id: 'handle'

- assertVisible:
    id: 'player-row-player-1'
    text: 'Player 1'

# a second player is required here, not merely convenient — see
# SCN-017.yaml's own comment above for why: `../player-row/live-content.tsx`'s
# own gating only wires `onDetailPress` up once a result exists for that
# player (`hasResult && isHandRange`), and a result can never exist for a
# lone player (evaluation requires 2-3 players).
- tapOn:
    id: 'analyze-add-player-fab'
- tapOn:
    id: 'tab-handRange'
- tapOn:
    id: 'chip-A2s+'
- tapOn:
    id: 'handle'

- assertVisible:
    id: 'player-row-player-2'
    text: 'Player 2'

# this scenario's own anchor: `analyze-equity-progress-bar`
# (src/features/evaluations/ui/analyze-screen/analyze-screen.tsx) mounts
# exactly when `useEquityEvaluationStatus()` reads 'calculating' — the same
# store status `equity-breakdown-sheet.tsx`'s own `isCalculating` reads.
# Asserting it here confirms the calculation this scenario means to catch
# is actually still running before the tap below, rather than assuming it.
- assertVisible:
    id: 'analyze-equity-progress-bar'

# NOT YET VERIFIABLE FROM CI OR THIS SESSION, carrying a second,
# scenario-specific risk on top of SCN-017's own standing one: past this
# point needs modules/espada-engine's built native binaries and a real
# device or simulator (docs/operations/native-module-artifacts.md), and
# Maestro does not run in this project's CI either. This flow additionally
# assumes the calculation is still 'calculating' by the time this tap lands
# and the sheet finishes opening — the progress bar's own visibility just
# above confirms it was running a moment earlier, not that it still is once
# the tap and the sheet's own opening transition have both completed. A
# fast enough native settle in between could show the settled histogram
# instead of the loading state this scenario means to exercise; whoever
# next confirms this on-device should watch for that race specifically, in
# addition to the pending-result race SCN-017's own flow file already
# records.
- tapOn:
    id: 'detail'
    childOf:
      id: 'player-row-player-1'

- assertVisible:
    id: 'analyze-equity-breakdown-sheet'
- assertVisible:
    id: 'heading'
    text: 'Equity Breakdown'
- assertVisible:
    id: 'chart'

# the loading treatment (issue #294): a breathing status word and its
# supporting line render in place of any bars, and each of the four legend
# items reads an en dash rather than a formatted count.
- assertVisible:
    id: 'calculating-label'
    text: 'Calculating'
- assertVisible:
    id: 'calculating-description'
    text: 'The breakdown appears once this finishes.'
- assertVisible:
    id: 'count'
    childOf:
      id: 'legend-trash'
    text: '–'
- assertVisible:
    id: 'count'
    childOf:
      id: 'legend-nuts'
    text: '–'

- tapOn:
    id: 'handle'

- assertNotVisible:
    id: 'analyze-equity-breakdown-sheet'
